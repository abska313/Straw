      discovery: document.getElementById('discovery')
    };
    this.panelOpen = null;
    this.tutorialTimer = 0;
    this._hudTick = 0;
    this.bindButtons();
  }
  bindButtons() {
    const el = this.el;
    const bind = (id, fn) => {
      const b = document.getElementById(id);
      if (!b) return;
      b.addEventListener('click', e => { e.preventDefault(); fn(); });
      b.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive:false });
    };
    bind('btn-inv',      () => this.togglePanel('inv'));
    bind('btn-shop',     () => this.togglePanel('shop'));
    bind('btn-settings', () => this.togglePanel('settings'));
    bind('btn-skills',   () => this.togglePanel('skills'));
    bind('btn-missions', () => this.togglePanel('missions'));
    bind('btn-machines', () => this.togglePanel('machines'));
    bind('btn-stats',    () => this.togglePanel('stats'));
    bind('btn-areas',    () => this.togglePanel('areas'));
    bind('btn-ach',      () => this.togglePanel('ach'));
    document.querySelectorAll('.close-x').forEach(b => b.addEventListener('click', () => this.closeAll()));
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', e => {
      const parent = t.closest('.panel');
      parent.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      this.renderTab(parent.id, t.dataset.tab);
    }));

    const action = document.getElementById('btn-action');
    action.addEventListener('touchstart', e => { e.preventDefault(); this.game.doInteract(); }, { passive:false });
    action.addEventListener('click', () => this.game.doInteract());

    const jump = document.getElementById('btn-jump');
    jump.addEventListener('touchstart', e => { e.preventDefault(); this.game.input.triggerJump(); }, { passive:false });
    jump.addEventListener('click', () => this.game.input.triggerJump());

    const sprint = document.getElementById('btn-sprint');
    const setSprint = v => this.game.input.buttons.sprint = v;
    sprint.addEventListener('touchstart', e => { e.preventDefault(); setSprint(true); }, { passive:false });
    sprint.addEventListener('touchend', () => setSprint(false));
    sprint.addEventListener('touchcancel', () => setSprint(false));

    const crouch = document.getElementById('btn-crouch');
    const toggleCrouch = () => {
      this.game.input.buttons.crouch = !this.game.input.buttons.crouch;
      crouch.style.background = this.game.input.buttons.crouch ? 'rgba(255,180,50,0.4)' : '';
    };
    crouch.addEventListener('click', toggleCrouch);
    crouch.addEventListener('touchstart', e => { e.preventDefault(); toggleCrouch(); }, { passive:false });

    const sens = document.getElementById('set-sens');
    sens.addEventListener('input', () => { this.game.input.sensitivity = 0.00025 * parseInt(sens.value); this.game.saveSettings(); });
    const fov = document.getElementById('set-fov');
    fov.addEventListener('input', () => { this.game.camera.fov = parseInt(fov.value); this.game.camera.updateProjectionMatrix(); this.game.saveSettings(); });
    const audioCb = document.getElementById('set-audio');
    audioCb.addEventListener('change', () => { this.game.audio.enabled = audioCb.checked; this.game.saveSettings(); });
    document.getElementById('btn-save').addEventListener('click', async () => { await this.game.saveGame(); this.notify('Game saved.', 'uncommon'); });
    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (confirm('Reset ALL progress? Cannot be undone.')) {
        await this.game.saveSystem.clear();
        localStorage.removeItem('haystack-settings');
        location.reload();
      }
    });
  }
  togglePanel(name) {
    if (this.panelOpen === name) { this.closeAll(); return; }
    this.closeAll();
    this.panelOpen = name;
    const map = {
      inv:      [this.el.invPanel,      () => this.renderInventory()],
      shop:     [this.el.shopPanel,     () => this.renderShop('sell')],
      settings: [this.el.settingsPanel, () => this.fillSettings()],
      skills:   [this.el.skillsPanel,   () => this.renderSkills()],
      missions: [this.el.missionsPanel, () => this.renderMissions('active')],
      machines: [this.el.machinesPanel, () => this.renderMachines()],
      stats:    [this.el.statsPanel,    () => this.renderStats()],
      areas:    [this.el.areasPanel,    () => this.renderAreas()],
      ach:      [this.el.achPanel,      () => this.renderAchievements()]
    };
    const entry = map[name]; if (!entry) return;
    entry[1]();
    entry[0].classList.remove('hidden');
    this.game.audio.play('click');
  }
  closeAll() {
    for (const k of ['invPanel','shopPanel','settingsPanel','skillsPanel','missionsPanel','machinesPanel','statsPanel','areasPanel','achPanel'])
      this.el[k].classList.add('hidden');
    this.panelOpen = null;
  }
  renderTab(panelId, tab) {
    if (panelId === 'panel-shop') return this.renderShop(tab);
    if (panelId === 'panel-missions') return this.renderMissions(tab);
  }
  fillSettings() {
    document.getElementById('set-sens').value = Math.round(this.game.input.sensitivity / 0.00025);
    document.getElementById('set-fov').value = this.game.camera.fov;
    document.getElementById('set-audio').checked = this.game.audio.enabled;
  }
  renderInventory() {
    const inv = this.game.inventory;
    const list = this.el.invList;
    const cap = this.el.invCount;
    if (cap) cap.textContent = `${inv.slots.length}/${inv.maxSlots}`;
    if (inv.slots.length === 0) { list.innerHTML = '<div class="empty">Empty</div>'; return; }
    list.innerHTML = inv.slots.map(s => {
      const it = ITEMS[s.id]; if (!it) return '';
      const unit = Math.floor(it.value * this.game.skills.sellPriceMult());
      return `<div class="item-row rarity-${it.rarity}">
        <div class="item-icon">${it.icon}</div>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          <div class="item-desc">$${unit} ea · ${it.desc}</div>
        </div>
        <div class="item-qty">×${s.qty}</div>
        <button class="item-action" data-sell="${s.id}">Sell</button>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-sell]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.sell;
      const total = this.game.sellItem(id, this.game.inventory.count(id));
      this.notify(`Sold for $${total}`, 'uncommon');
      this.renderInventory();
    }));
  }
  renderShop(tab) {
    const body = this.el.shopBody;
    if (tab === 'sell') {
      const inv = this.game.inventory;
      const sellable = inv.slots.filter(s => ITEMS[s.id]?.sellable);
      if (sellable.length === 0) { body.innerHTML = '<div class="empty">Nothing to sell.</div>'; return; }
      let total = 0, count = 0;
      const rows = sellable.map(s => {
        const it = ITEMS[s.id];
        const unit = Math.floor(it.value * this.game.skills.sellPriceMult());
        const sub = unit * s.qty; total += sub; count += s.qty;
        return `<div class="item-row rarity-${it.rarity}">
          <div class="item-icon">${it.icon}</div>
          <div class="item-info"><div class="item-name">${it.name}</div>
            <div class="item-desc">$${unit} × ${s.qty} = <b>$${sub}</b></div></div>
          <button class="item-action" data-sell="${s.id}">Sell</button>
        </div>`;
      }).join('');
      body.innerHTML = rows + `<button class="big-btn" id="do-sell">SELL ALL (${count}) — $${total}</button>`;
      body.querySelectorAll('[data-sell]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.sell;
        const t = this.game.sellItem(id, this.game.inventory.count(id));
        this.notify(`Sold for $${t}`, 'uncommon');
        this.renderShop('sell'); this.refresh();
      }));
      document.getElementById('do-sell').addEventListener('click', () => {
        const earned = this.game.sellAll();
        this.notify(`Sold for $${earned}`, 'uncommon');
        this.renderShop('sell'); this.refresh();
      });
    } else if (tab === 'tools') {
      const ts = this.game.toolSystem;
      const current = this.game.state.toolId;
      let html = '';
      for (const t of Object.values(TOOLS)) {
        const owned = ts.has(t.id);
        const isCurrent = current === t.id;
        const price = this.game.applyShopDiscount(t.price);
        const canAfford = this.game.state.money >= price;
        const dur = owned ? Math.round(ts.getDur(t.id)) : 0;
        const maxDur = owned ? ts.getMaxDur(t.id) : t.maxDur;
        const level = ts.getLevel(t.id);
        let action = '';
        if (t.id === 'hands') {
          action = isCurrent ? '<button class="item-action" disabled>Equipped</button>' : `<button class="item-action" data-eq="${t.id}">Equip</button>`;
        } else if (owned) {
          action = isCurrent
            ? `<button class="item-action" disabled>Equipped</button>`
            : `<button class="item-action" data-eq="${t.id}">Equip</button>`;
          const upg = UPGRADE_COST(t.price, level - 1);
          if (level < UPGRADE_MAX) action += `<button class="item-action alt" data-upg="${t.id}" ${this.game.state.money >= upg ? '' : 'disabled'}>Upg $${upg}</button>`;
          if (ts.getDur(t.id) < maxDur) {
            const repCost = Math.ceil((maxDur - ts.getDur(t.id)) * 0.5 + t.price * 0.02);
            action += `<button class="item-action alt" data-rep="${t.id}" ${this.game.state.money >= repCost ? '' : 'disabled'}>Rep $${repCost}</button>`;
          }
        } else {
          action = `<button class="item-action" data-buy="${t.id}" ${canAfford ? '' : 'disabled'}>$${price}</button>`;
        }
        html += `<div class="item-row rarity-uncommon">
          <div class="item-icon">${t.icon}</div>
          <div class="item-info">
            <div class="item-name">${t.name} ${owned ? `<small>T${t.tier} · Lv${level}</small>` : ''}</div>
            <div class="item-desc">${t.desc} · Yield ${t.baseYield} · Speed ${t.speed.toFixed(2)}x${owned && maxDur ? ` · Dur ${dur}/${maxDur}` : ''}</div>
          </div>
          <div class="row-actions">${action}</div>
        </div>`;
      }
      body.innerHTML = html;
      body.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.buy; const t = TOOLS[id];
        const price = this.game.applyShopDiscount(t.price);
        if (this.game.state.money < price) return;
        this.game.state.money -= price;
        this.game.statistics.inc('moneySpent', price);
        this.game.statistics.inc('toolsBought', 1);
        this.game.toolSystem.buy(id);
        this.game.state.toolId = id;
        this.game.statistics.inc('upgradesApplied', 1);
        this.game.audio.play('buy');
        this.notify(`Bought ${t.name}`, 'rare');
        this.game.checkProgress();
        this.refresh(); this.renderShop('tools');
      }));
      body.querySelectorAll('[data-upg]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.upg;
        const lvl = ts.getLevel(id);
        const cost = UPGRADE_COST(TOOLS[id].price, lvl - 1);
        if (this.game.state.money < cost) return;
        this.game.state.money -= cost;
        this.game.statistics.inc('moneySpent', cost);
        this.game.statistics.inc('upgradesApplied', 1);
        ts.upgrade(id);
        this.game.audio.play('buy');
        this.notify(`Upgraded ${TOOLS[id].name} → Lv${ts.getLevel(id)}`, 'epic');
        this.game.checkProgress();
        this.refresh(); this.renderShop('tools');
      }));
      body.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.rep;
        const max = ts.getMaxDur(id);
        const cost = Math.ceil((max - ts.getDur(id)) * 0.5 + TOOLS[id].price * 0.02);
        if (this.game.state.money < cost) return;
        this.game.state.money -= cost;
        this.game.statistics.inc('moneySpent', cost);
        ts.repair(id);
        this.game.audio.play('buy');
        this.notify(`Repaired ${TOOLS[id].name}`, 'uncommon');
        this.refresh(); this.renderShop('tools');
      }));
      body.querySelectorAll('[data-eq]').forEach(b => b.addEventListener('click', () => {
        this.game.state.toolId = b.dataset.eq;
        this.game.audio.play('click');
        this.refresh(); this.renderShop('tools');
      }));
    } else if (tab === 'machines') {
      const lvl = this.game.state.level;
      body.innerHTML = Object.values(MACHINE_TYPES).map(t => {
        const price = this.game.applyShopDiscount(t.price);
        const owned = this.game.machines.machines.filter(m => m.type.id === t.id).length;
        const canBuy = lvl >= t.reqLevel && this.game.state.money >= price;
        return `<div class="item-row rarity-epic">
          <div class="item-icon">${t.icon}</div>
          <div class="item-info">
            <div class="item-name">${t.name} ${owned ? `<small>Owned ×${owned}</small>` : ''}</div>
            <div class="item-desc">${t.desc}<br>Rate ${t.baseRate}/s · Cap ${t.baseCapacity} · Req Lv${t.reqLevel}</div>
          </div>
          <button class="item-action" data-bm="${t.id}" ${canBuy ? '' : 'disabled'}>$${price}</button>
        </div>`;
      }).join('');
      body.querySelectorAll('[data-bm]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.bm; const t = MACHINE_TYPES[id];
        const price = this.game.applyShopDiscount(t.price);
        if (this.game.state.money < price) return;
        const pile = this.game.hayPiles.find(p => p.remaining > 0);
        if (!pile) { this.notify('No hay pile available.', 'rare'); return; }
        const r = this.game.machines.install(id, pile);
        if (!r.ok) { this.notify(r.reason || 'Cannot install.', 'rare'); return; }
        this.game.statistics.inc('moneySpent', price);
        this.game.audio.play('buy');
        this.refresh(); this.renderShop('machines');
      }));
    }
  }
  renderSkills() {
    const tree = this.game.skills;
    const body = this.el.skillsBody;
    let html = `<div class="skills-head">Skill Points: <b>${tree.points}</b></div>`;
    for (const cat of SKILL_CATEGORIES) {
      const list = Object.entries(SKILLS).filter(([, s]) => s.cat === cat.id);
      if (!list.length) continue;
      html += `<div class="skill-cat"><h3>${cat.icon} ${cat.name}</h3>`;
      for (const [id, s] of list) {
        const lvl = tree.getLevel(id);
        const check = tree.canBuy(id, this.game.state.level);
        const locked = lvl === 0 && !check.ok;
        html += `<div class="skill-row ${locked ? 'locked' : ''}">
          <div class="skill-icon">${s.icon}</div>
          <div class="skill-info">
            <div class="skill-name">${s.name} <small>${lvl}/${s.max}</small></div>
            <div class="skill-desc">${s.desc}</div>
            <div class="skill-req">${s.reqLvl > 1 ? `Req Lv${s.reqLvl}` : ''}${s.requires.length ? ' · After: ' + s.requires.map(r => SKILLS[r].name).join(', ') : ''}</div>
          </div>
          <button class="skill-buy" data-skill="${id}" ${check.ok ? '' : 'disabled'}>${lvl >= s.max ? 'MAX' : `${s.cost} SP`}</button>
        </div>`;
      }
      html += `</div>`;
    }
    body.innerHTML = html;
    body.querySelectorAll('[data-skill]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.skill;
      const r = tree.buy(id, this.game.state.level);
      if (!r.ok) { this.notify(r.reason || 'Cannot buy.', 'rare'); this.game.audio.play('error'); return; }
      this.game.audio.play('skillBuy');
      this.notify(`✦ Learned ${SKILLS[id].name} Lv${tree.getLevel(id)}`, 'epic');
      this.game.player.setMaxStamina(100 + this.game.skills.maxStaminaBonus());
      this.refresh(); this.renderSkills();
      this.game.saveGame();
    }));
  }
  renderMissions(tab) {
    const body = this.el.missionsBody;
    const ms = this.game.missions;
    const list = MISSIONS.filter(m => tab === 'active' ? !ms.claimed[m.id] : ms.claimed[m.id]);
    if (!list.length) { body.innerHTML = `<div class="empty">No missions.</div>`; return; }
    body.innerHTML = list.map(m => {
      const p = Math.min(ms.getProgress(m), m.target);
      const pct = (p / m.target) * 100;
      const canClaim = ms.canClaim(m);
      return `<div class="mission-row">
        <div class="mission-title">${m.title}</div>
        <div class="mission-desc">${m.desc}</div>
        <div class="mission-progress"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span>${p}/${m.target}</span></div>
        <div class="mission-reward">
          ${m.reward.xp ? `+${m.reward.xp} XP` : ''} ${m.reward.money ? `+$${m.reward.money}` : ''}
          ${ms.claimed[m.id] ? '<span class="badge">Claimed</span>' :
            canClaim ? `<button class="item-action" data-claim="${m.id}">CLAIM</button>` : '<span class="badge wait">In Progress</span>'}
        </div>
      </div>`;
    }).join('');
    body.querySelectorAll('[data-claim]').forEach(b => b.addEventListener('click', () => {
      this.game.missions.claim(b.dataset.claim);
      this.refresh(); this.renderMissions(tab);
    }));
  }
  renderMachines() {
    const mm = this.game.machines;
    const body = this.el.machinesBody;
    if (!mm.machines.length) { body.innerHTML = '<div class="empty">No machines. Buy one from Shop → Machines.</div>'; return; }
    body.innerHTML = mm.machines.map((m, i) => {
      const pct = Math.min(100, (m.storage.hay / m.capacity) * 100);
      return `<div class="machine-row">
        <div class="machine-head"><span class="mi">${m.type.icon}</span> ${m.type.name} <small>Lv${m.level}</small></div>
        <div class="machine-stat">Status: <b>${m.running ? 'Working' : 'Stopped'}</b></div>
        <div class="machine-stat">Hay: ${m.storage.hay} / ${m.capacity}</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="machine-stat">Items held: ${Object.values(m.itemsFound).reduce((a,n)=>a+n,0)}</div>
        <div class="machine-actions">
          <button class="item-action" data-mstop="${i}">${m.running ? 'Stop' : 'Start'}</button>
          <button class="item-action" data-mcollect="${i}">Collect</button>
          <button class="item-action alt" data-mupg="${i}" ${this.game.state.money >= m.upgradeCost() ? '' : 'disabled'}>Upg $${m.upgradeCost()}</button>
        </div>
      </div>`;
    }).join('');
    body.querySelectorAll('[data-mstop]').forEach(b => b.addEventListener('click', () => {
      const m = mm.machines[+b.dataset.mstop];
      m.running = !m.running;
      this.renderMachines(); this.game.audio.play('click');
    }));
    body.querySelectorAll('[data-mcollect]').forEach(b => b.addEventListener('click', () => {
      mm.collect(mm.machines[+b.dataset.mcollect]); this.renderMachines(); this.refresh();
    }));
    body.querySelectorAll('[data-mupg]').forEach(b => b.addEventListener('click', () => {
      const m = mm.machines[+b.dataset.mupg];
      const cost = m.upgradeCost();
      if (this.game.state.money < cost) return;
      this.game.state.money -= cost;
      this.game.statistics.inc('moneySpent', cost);
      m.upgrade();
      this.game.audio.play('buy');
      this.notify(`${m.type.name} → Lv${m.level}`, 'epic');
      this.renderMachines(); this.refresh();
    }));
  }
  renderStats() {
    const s = this.game.statistics.data;
    const rows = [
      ['Play time',         this._fmtTime(s.playTime)],
      ['Level',             this.game.state.level],
      ['XP earned',         Math.floor(s.xpEarned)],
      ['Searches',          s.searches],
      ['Hay removed',       s.hayRemoved],
      ['Items found',       s.itemsFound],
      ['Items sold',        s.itemsSold],
      ['Rare finds',        s.rareFound],
      ['Epic finds',        s.epicFound],
      ['Legendary finds',   s.legendaryFound],
      ['Mythic finds',      s.mythicFound],
      ['Needles found',     s.needlesFound],
      ['Money earned',      '$' + Math.floor(s.moneyEarned)],
      ['Money spent',       '$' + Math.floor(s.moneySpent)],
      ['Tools bought',      s.toolsBought],
      ['Upgrades applied',  s.upgradesApplied],
      ['Machines built',    s.machinesBuilt],
      ['Missions done',     s.missionsCompleted],
      ['Areas unlocked',    s.areasUnlocked]
    ];
    this.el.statsBody.innerHTML = rows.map(([k,v]) =>
      `<div class="stat-row"><span>${k}</span><b>${v}</b></div>`).join('');
  }
  _fmtTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return `${h}h ${m}m ${s}s`;
  }
  renderAreas() {
    const body = this.el.areasBody;
    body.innerHTML = AREAS.map(a => {
      const unlocked = this.game.areas.unlocked[a.id];
      const current = this.game.areas.current === a.id;
      const check = this.game.areas.canUnlock(a.id);
      const btn = current
        ? `<button class="item-action" disabled>Current</button>`
        : unlocked
          ? `<button class="item-action" data-enter="${a.id}">Enter</button>`
          : `<button class="item-action" data-unlock="${a.id}" ${check.ok ? '' : 'disabled'}>Unlock $${a.reqMoney}</button>`;
      return `<div class="area-row ${unlocked ? '' : 'locked'}">
        <div class="area-head">${a.name} <small>Lv${a.reqLevel} · ${a.difficulty}</small></div>
        <div class="area-desc">${a.desc}</div>
        <div class="area-stats">${a.piles} piles × ${a.hayPerPile} hay · Rare ×${a.rareMult}</div>
        ${btn}
      </div>`;
    }).join('');
    body.querySelectorAll('[data-enter]').forEach(b => b.addEventListener('click', () => {
      this.game.switchArea(b.dataset.enter); this.closeAll();
    }));
    body.querySelectorAll('[data-unlock]').forEach(b => b.addEventListener('click', () => {
      const r = this.game.areas.unlock(b.dataset.unlock);
      if (!r.ok) { this.notify(r.reason, 'rare'); return; }
      this.game.statistics.inc('moneySpent', AREAS.find(a => a.id === b.dataset.unlock).reqMoney);
      this.renderAreas(); this.refresh();
    }));
  }
  renderAchievements() {
    const body = this.el.achBody;
    const unlocked = this.game.achievements.unlocked;
    body.innerHTML = ACHIEVEMENTS.map(a => {
      const on = !!unlocked[a.id];
      const cur = a.stat === '__level' ? this.game.state.level : this.game.statistics.get(a.stat);
      const pct = Math.min(100, (cur / a.target) * 100);
      return `<div class="ach-row ${on ? 'unlocked' : ''}">
        <div class="ach-icon">${a.icon}</div>
        <div class="ach-info">
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
          <div class="bar small"><div class="fill" style="width:${pct}%"></div></div>
          <div class="ach-prog">${Math.min(cur,a.target)} / ${a.target}</div>
        </div>
        <div class="ach-badge">${on ? '✓' : ''}</div>
      </div>`;
    }).join('');
  }
  refresh() {
    const s = this.game.state;
    const ts = this.game.toolSystem;
    const toolId = s.toolId;
    const t = TOOLS[toolId];
    const need = this.game.xpForLevel(s.level);
    this.el.money.textContent = Math.floor(s.money);
    this.el.level.textContent = 'Lv.' + s.level;
    this.el.xpFill.style.width = Math.min(100, (s.xp / need) * 100) + '%';
    this.el.xpText.textContent = `${Math.floor(s.xp)}/${need}`;
    this.el.tool.textContent = t ? t.name : 'Bare Hands';
    if (t && t.maxDur > 0) {
      const d = Math.round(ts.getDur(toolId));
      const m = ts.getMaxDur(toolId);
      this.el.dur.textContent = `🔧 ${d}/${m}` + (ts.isBroken(toolId) ? ' (BROKEN)' : '');
    } else this.el.dur.textContent = '';
    if (this.el.invCount) this.el.invCount.textContent = `${this.game.inventory.slots.length}/${this.game.inventory.maxSlots}`;
    if (this.panelOpen === 'inv') this.renderInventory();
    if (this.panelOpen === 'skills') this.renderSkills();
    if (this.panelOpen === 'missions') this.renderMissions('active');
    if (this.panelOpen === 'machines') this.renderMachines();
    if (this.panelOpen === 'stats') this.renderStats();
    if (this.panelOpen === 'areas') this.renderAreas();
    if (this.panelOpen === 'ach') this.renderAchievements();
  }
  tick(dt) {
    this._hudTick += dt;
    if (this._hudTick < 0.15) return;
    this._hudTick = 0;
    const p = this.game.player;
    const pct = (p.stamina / p.maxStamina) * 100;
    if (this.el.staminaFill) this.el.staminaFill.style.width = pct + '%';
    if (this.el.staminaText) this.el.staminaText.textContent = `⚡ ${Math.round(p.stamina)}/${Math.round(p.maxStamina)}`;
  }
  updatePrompt(target) {
    if (target) {
      this.el.prompt.classList.remove('hidden');
      this.el.crosshair.classList.add('target');
    } else {
      this.el.prompt.classList.add('hidden');
      this.el.crosshair.classList.remove('target');
    }
  }
  notify(msg, rarity = 'common') {
    const d = document.createElement('div');
    d.className = 'notif rarity-' + rarity;
    d.textContent = msg;
    this.el.notifs.appendChild(d);
    setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity 0.3s'; }, 2200);
    setTimeout(() => d.remove(), 2600);
  }
  discoveryPopup(item, qty) {
    const d = this.el.discovery;
    if (!d) return;
    if (!['rare','epic','legendary','mythic'].includes(item.rarity)) return;
    d.innerHTML = `<div class="disc-inner rarity-${item.rarity}">
      <div class="disc-icon">${item.icon}</div>
      <div class="disc-title">${RARITIES[item.rarity].name.toUpperCase()} FIND!</div>
      <div class="disc-name">${item.name} ${qty > 1 ? '×'+qty : ''}</div>
      <div class="disc-val">+${RARITIES[item.rarity].xp * qty} XP</div>
    </div>`;
    d.classList.remove('hidden');
    d.classList.remove('play'); void d.offsetWidth; d.classList.add('play');
    setTimeout(() => d.classList.add('hidden'), 1400);
  }
  levelUpFlash() {
    document.body.classList.add('level-flash');
    setTimeout(() => document.body.classList.remove('level-flash'), 800);
  }
  saveFlash(text, fading) {
    const t = this.el.saveToast; if (!t) return;
    t.textContent = text;
    t.classList.remove('hidden');
    t.style.opacity = '1';
    if (fading) setTimeout(() => { t.style.opacity = '0'; }, 700);
  }
  showTutorial(text, ms = 5000) {
    this.el.tutorialText.textContent = text;
    this.el.tutorial.classList.remove('hidden');
    clearTimeout(this.tutorialTimer);
    this.tutorialTimer = setTimeout(() => this.el.tutorial.classList.add('hidden'), ms);
  }
}

/* ==================== GAME ==================== */
class Game {
  constructor() {
    this.clock = new THREE.Clock();
    this.state = { money: 50, xp: 0, level: 1, toolId: 'hands', hayRemoved: 0, foundNeedle: false, xpToNext: 100 };
    this.hayPiles = [];
    this.savedData = null;
    this.storage = new Storage(500);
  }
  xpForLevel(level) { return Math.floor(100 + (level - 1) * 100 + Math.pow(level - 1, 2) * 50); }

  async init() {
    // Renderer
    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.05;
    document.getElementById('game-container').appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

    this.events = new EventBus();
    this.saveSystem = new SaveSystem();
    await this.saveSystem.init();
    try {
      this.savedData = await this.saveSystem.load('main2') || await this.saveSystem.load('main');
    } catch (e) { console.warn('Save load failed:', e); }

    this.input = new Input();
    this.audio = new AudioSystem(); this.audio.init();

    this.world = new World(this.scene);
    this.world.build();

    this.inventory = new Inventory(24);
    this.toolSystem = new ToolSystem();
    this.skills = new SkillTree();
    this.statistics = new Statistics();
    this.player = new Player(this.camera, this.input);

    this.raycaster = new THREE.Raycaster();
    this.raycaster.far = 3.5;

    this.missions = new MissionSystem(this);
    this.achievements = new AchievementSystem(this);
    this.areas = new AreaSystem(this);
    this.machines = new MachineManager(this);

    this.ui = new UI(this);

    this.buildAreaPiles('field');

    if (this.savedData) {
      try { this.restore(this.savedData); this.ui.notify('Progress loaded.', 'uncommon'); }
      catch (e) { console.error('Restore error:', e); }
    } else {
      this.ui.showTutorial('🎯 Find the lost needle hidden in the haystack.', 7000);
    }

    this.setupJoystick();
    this.setupTouchLook();
    window.addEventListener('resize', () => this.onResize());
    window.addEventListener('pointerdown', () => this.audio.resume(), { once: true });

    setInterval(() => this.saveGame(), 20000);
    window.addEventListener('beforeunload', () => this.saveGame());

    this.events.on('itemFound', () => { this.statistics.inc('itemsFound', 1); this.checkProgress(); });
    this.events.on('hayRemoved', d => { this.statistics.inc('hayRemoved', d.amount); this.checkProgress(); });

    this.ui.refresh();
  }

  buildAreaPiles(areaId) {
    for (const p of this.hayPiles) p.dispose();
    this.hayPiles = [];
    const area = this.areas.get(areaId) || AREAS[0];
    const seedBase = areaId.length * 1000;
    for (let i = 0; i < area.piles; i++) {
      const angle = (i / area.piles) * Math.PI * 2 + 0.6;
      const r = 8 + i * 2.5;
      const pos = new THREE.Vector3(area.pos.x + Math.cos(angle) * r, 0, area.pos.z + Math.sin(angle) * r - 3);
      const size = { x: 3 + Math.random() * 1.2, y: 2.2 + Math.random() * 0.8, z: 3 + Math.random() * 1.2 };
      const pile = new HayPile(this.scene, pos, area.hayPerPile, size, seedBase + i * 37);
      pile.area = area;
      this.hayPiles.push(pile);
    }
  }

  switchArea(areaId) {
    if (!this.areas.unlocked[areaId]) return;
    this.areas.current = areaId;
    const area = this.areas.get(areaId);
    this.player.position.set(area.pos.x, 1.7, area.pos.z + 5);
    this.buildAreaPiles(areaId);
    this.machines.machines = this.machines.machines.filter(m => this.hayPiles.includes(m.targetPile));
    this.ui.notify(`🌍 Entered ${area.name}`, 'rare');
    this.ui.refresh();
  }

  start() {
    this.clock.start();
    const loop = () => {
      const dt = Math.min(this.clock.getDelta(), 0.05);
      this.update(dt);
      this.renderer.render(this.scene, this.camera);
      requestAnimationFrame(loop);
    };
    loop();
  }

  update(dt) {
    if (this.ui.panelOpen) { this.input.move.x = 0; this.input.move.y = 0; }
    this.player.update(dt);
    this.player.regenStamina(dt, this.skills.staminaRegenMult());
    this.statistics.data.playTime += dt;

    if (this.input.consumeAction()) this.doInteract();

    const tool = this.toolSystem.get(this.state.toolId);
    const tier = tool.tier + this.skills.effectiveTierBonus();
    const area = this.areas.get(this.areas.current) || AREAS[0];
    const ctx = {
      tier,
      itemMult: area.itemMult,
      rareMult: area.rareMult,
      precisionBonus: this.skills.itemChanceMult() - 1,
      rareBonus: this.skills.rareChanceBonus(),
      treasureBonus: this.skills.treasureBonus()
    };
    for (const p of this.hayPiles) p.setSearchContext(ctx);

    this.machines.update(dt);

    const target = this.getLookTarget();
    this.ui.updatePrompt(target);
    if (target) {
      const pile = this.hayPiles.find(p => p.proxy === target.object);
      if (pile && pile.remaining === 0) this.ui.el.prompt.textContent = '⛔ Empty';
      else if (this.toolSystem.isBroken(this.state.toolId)) this.ui.el.prompt.textContent = '🔧 Tool Broken';
      else if (this.player.exhausted) this.ui.el.prompt.textContent = '😮‍💨 Exhausted';
      else this.ui.el.prompt.textContent = '⛏ Remove Hay';
    }

    this.ui.tick(dt);
  }

  getLookTarget() {
    this.raycaster.setFromCamera({ x: 0, y: 0 }, this.camera);
    const proxies = this.hayPiles.map(p => p.proxy);
    const hits = this.raycaster.intersectObjects(proxies, false);
    return hits[0] || null;
  }

  doInteract() {
    if (this.ui.panelOpen) return;
    const hit = this.getLookTarget();
    if (!hit) { this.player.addShake(0.08); this.audio.play('error'); return; }
    const pile = this.hayPiles.find(p => p.proxy === hit.object);
    if (!pile || pile.remaining <= 0) { this.player.addShake(0.08); return; }

    const toolId = this.state.toolId;
    const tool = this.toolSystem.get(toolId);
    if (this.toolSystem.isBroken(toolId)) {
      this.ui.notify('🔧 Tool broken! Repair it.', 'rare');
      this.audio.play('broken');
      return;
    }
    if (this.player.exhausted) {
      this.ui.notify('😮‍💨 Too exhausted.', 'common');
      return;
    }
    this.player.drainStamina(tool.stamina * 2);

    const skillMult = this.skills.searchYieldMult() * this.skills.toolYieldMult();
    const yieldAmount = this.toolSystem.getYield(toolId, skillMult);
    const result = pile.removeAt(hit.point, yieldAmount);
    if (result.removed <= 0) return;

    this.inventory.add('hay', result.removed);
    this.state.hayRemoved += result.removed;
    this.statistics.inc('searches', 1);
    this.statistics.inc('toolsUsed', 1);

    const duraCost = tool.durCost * this.skills.durabilityMult();
    if (duraCost > 0) {
      this.toolSystem.damage(toolId, duraCost);
      if (this.toolSystem.isBroken(toolId)) {
        this.ui.notify(`🔧 ${tool.name} broke!`, 'rare');
        this.audio.play('broken');
      }
    }

    this.player.addShake(0.15);
    this.audio.play('removeHay');
    this.addXP(Math.max(1, Math.floor(result.removed / 8)));

    const found = pile.rollItems(result.removed);
    for (const f of found) {
      const item = ITEMS[f.id];
      if (!item) continue;
      this.inventory.add(f.id, f.qty);
      const rare = ['rare','epic','legendary','mythic'].includes(item.rarity);
      if (rare) this.statistics.inc('rareFound', f.qty);
      if (item.rarity === 'epic') this.statistics.inc('epicFound', f.qty);
      if (item.rarity === 'legendary') this.statistics.inc('legendaryFound', f.qty);
      if (item.rarity === 'mythic') this.statistics.inc('mythicFound', f.qty);
      if (item.category === 'needle') {
        this.statistics.inc('needlesFound', f.qty);
        if (!this.state.foundNeedle) {
          this.state.foundNeedle = true;
          this.ui.showTutorial('✅ You found a needle!', 7000);
        }
      }
      this.events.emit('itemFound', { id: f.id, qty: f.qty, pile });
      this.ui.notify(`+${f.qty} ${item.name}`, item.rarity);
      this.ui.discoveryPopup(item, f.qty);
      this.addXP((RARITIES[item.rarity]?.xp || 1) * f.qty);
      if (item.rarity === 'legendary' || item.rarity === 'mythic') this.audio.play('findLegendary');
      else if (rare) this.audio.play('findRare');
      else this.audio.play('findItem');
    }
    this.ui.refresh();
  }

  checkProgress() { this.missions.check(); this.achievements.check(); }

  addXP(amount) {
    if (amount <= 0) return;
    this.state.xp += amount;
    this.statistics.inc('xpEarned', amount);
    let need = this.xpForLevel(this.state.level);
    while (this.state.xp >= need) {
      this.state.xp -= need;
      this.state.level++;
      this.skills.grant(1);
      this.state.money += 25;
      this.ui.notify(`★ LEVEL UP! Lv.${this.state.level} · +1 SP`, 'epic');
      this.ui.levelUpFlash();
      this.audio.play('levelUp');
      this.player.addShake(0.3);
      need = this.xpForLevel(this.state.level);
      this.checkProgress();
      this.saveGame();
    }
    this.state.xpToNext = need;
  }

  sellItem(id, qty) {
    const have = this.inventory.count(id);
    const actual = Math.min(qty, have);
    if (actual <= 0) return 0;
    const item = ITEMS[id];
    const unit = Math.floor(item.value * this.skills.sellPriceMult());
    const total = unit * actual;
    this.inventory.remove(id, actual);
    this.state.money += total;
    this.statistics.inc('moneyEarned', total);
    this.statistics.inc('itemsSold', actual);
    this.audio.play('sell');
    this.ui.refresh();
    return total;
  }
  sellAll() {
    let total = 0, count = 0;
    for (const slot of [...this.inventory.slots]) {
      const item = ITEMS[slot.id]; if (!item?.sellable) continue;
      const unit = Math.floor(item.value * this.skills.sellPriceMult());
      total += unit * slot.qty;
      count += slot.qty;
      this.inventory.remove(slot.id, slot.qty);
    }
    this.state.money += total;
    this.statistics.inc('moneyEarned', total);
    this.statistics.inc('itemsSold', count);
    this.audio.play('sell');
    this.ui.refresh();
    return total;
  }
  applyShopDiscount(price) { return Math.floor(price * this.skills.shopPriceMult()); }

  setupJoystick() {
    const joy = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    let joyId = null; const R = 55; const center = { x:0, y:0 };
    const update = (cx, cy) => {
      const dx = cx - center.x, dy = cy - center.y;
      const dist = Math.hypot(dx, dy); const clamped = Math.min(dist, R);
      const nx = dist > 0 ? (dx / dist) : 0, ny = dist > 0 ? (dy / dist) : 0;
      knob.style.transform = `translate(calc(-50% + ${nx*clamped}px), calc(-50% + ${ny*clamped}px))`;
      this.input.move.x = nx * (clamped / R);
      this.input.move.y = ny * (clamped / R);
    };
    const reset = () => { knob.style.transform = 'translate(-50%, -50%)'; this.input.move.x = 0; this.input.move.y = 0; };
    joy.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const rect = joy.getBoundingClientRect();
      center.x = rect.left + rect.width / 2; center.y = rect.top + rect.height / 2;
      joyId = t.identifier; update(t.clientX, t.clientY);
    }, { passive:false });
    joy.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === joyId) update(t.clientX, t.clientY);
    }, { passive:false });
    const end = e => { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; reset(); } };
    joy.addEventListener('touchend', end);
    joy.addEventListener('touchcancel', end);
  }

  setupTouchLook() {
    const area = document.getElementById('look-area');
    let lookId = null; let lastX = 0, lastY = 0;
    area.addEventListener('touchstart', e => {
      if (e.target.closest('#buttons, #joystick, #panels, #hud, #quick-buttons')) return;
      const t = e.changedTouches[0];
      lookId = t.identifier; lastX = t.clientX; lastY = t.clientY;
    }, { passive:true });
    area.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) if (t.identifier === lookId) {
        this.input.look.dx += t.clientX - lastX;
        this.input.look.dy += t.clientY - lastY;
        lastX = t.clientX; lastY = t.clientY;
      }
    }, { passive:true });
    const end = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
    area.addEventListener('touchend', end);
    area.addEventListener('touchcancel', end);
    // Mouse fallback for desktop testing
    let mouseDown = false;
    area.addEventListener('mousedown', e => { mouseDown = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup', () => mouseDown = false);
    window.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      this.input.look.dx += e.clientX - lastX;
      this.input.look.dy += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
    });
  }

  restore(d) {
    if (d.state) this.state = { ...this.state, ...d.state };
    if (d.inventory) this.inventory.deserialize(d.inventory);
    if (d.tools) {
      this.toolSystem.deserialize(d.tools);
      if (d.tools.owned) this.toolSystem.migrateLegacy(d.tools.owned);
    }
    if (d.player) this.player.deserialize(d.player);
    if (d.skills) this.skills.deserialize(d.skills);
    if (d.statistics) this.statistics.deserialize(d.statistics);
    if (d.missions) this.missions.deserialize(d.missions);
    if (d.achievements) this.achievements.deserialize(d.achievements);
    if (d.areas) this.areas.deserialize(d.areas);
    if (d.storage) this.storage.deserialize(d.storage);
    if (d.piles && d.areaId === this.areas.current) {
      for (let i = 0; i < Math.min(this.hayPiles.length, d.piles.length); i++)
        this.hayPiles[i].deserialize(d.piles[i]);
    }
    if (d.machines) this.machines.deserialize(d.machines);
    this.state.xpToNext = this.xpForLevel(this.state.level);
    this.player.setMaxStamina(100 + this.skills.maxStaminaBonus());
  }

  async saveGame() {
    const data = {
      state: { ...this.state },
      inventory: this.inventory.serialize(),
      tools: this.toolSystem.serialize(),
      player: this.player.serialize(),
      skills: this.skills.serialize(),
      statistics: this.statistics.serialize(),
      missions: this.missions.serialize(),
      achievements: this.achievements.serialize(),
      areas: this.areas.serialize(),
      storage: this.storage.serialize(),
      machines: this.machines.serialize(),
      piles: this.hayPiles.map(p => p.serialize()),
      areaId: this.areas.current
    };
    try {
      await this.saveSystem.save('main2', data);
      this.ui.saveFlash('SAVING...', false);
      setTimeout(() => this.ui.saveFlash('GAME SAVED', true), 120);
    } catch (e) { console.warn('Save failed:', e); }
  }

  saveSettings() {
    localStorage.setItem('haystack-settings', JSON.stringify({
      sens: this.input.sensitivity, fov: this.camera.fov, audio: this.audio.enabled
    }));
  }
  loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('haystack-settings') || '{}');
      if (s.sens) this.input.sensitivity = s.sens;
      if (s.fov) { this.camera.fov = s.fov; this.camera.updateProjectionMatrix(); }
      if (typeof s.audio === 'boolean') this.audio.enabled = s.audio;
    } catch (e) {}
  }

  onResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }
}

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => console.log('[PWA] SW registered:', reg.scope))
      .catch(err => console.warn('[PWA] SW failed:', err));
  });
}

// Prevent iOS double-tap zoom
let _lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTouch <= 300) e.preventDefault();
  _lastTouch = now;
}, { passive: false });

// Prevent context menu
document.addEventListener('contextmenu', e => e.preventDefault());

// Start game
window.addEventListener('DOMContentLoaded', async () => {
  const game = new Game();
  window.__game = game;
  try {
    await game.init();
    game.loadSettings();
    game.start();
  } catch (err) {
    console.error('Game failed to start:', err);
    document.body.innerHTML =
      '<div style="padding:40px;color:#fff;font-family:sans-serif;">' +
      'Failed to start: ' + err.message + '</div>';
  }
});
</script>
