<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d4b75c">
<meta name="description" content="محاكي 3D للبحث عن الإبر في أكوام القش">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-TileColor" content="#0a1a0f">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAYSTACK">
<meta name="mobile-web-app-capable" content="yes">

<title>HAYSTACK</title>

<style>
/* ================= BASE ================= */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; touch-action:none;
  overscroll-behavior:none; -webkit-user-select:none; }
#game-container { position:fixed; inset:0; z-index:0; }
#game-container canvas { display:block; width:100%; height:100%; }

/* ================= HUD ================= */
#hud { position:fixed; inset:0; z-index:4; pointer-events:none;
  padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px); }
#stats { display:flex; gap:8px; flex-wrap:wrap; }
.stat { background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); padding:6px 12px;
  border-radius:20px; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.stat.money { color:#ffd35c; }
.stat .icon { font-size:12px; opacity:0.85; }
.stat.xp { min-width:120px; flex-direction:column; align-items:stretch; padding:5px 12px; }
#ui-xp-bar { width:100%; height:6px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden; }
#ui-xp-fill { height:100%; width:0%; background:linear-gradient(90deg,#4ade80,#22d3ee); transition:width 0.3s; }
#ui-xp-text { font-size:10px; opacity:0.85; margin-top:2px; text-align:center; }
.stat.stamina { min-width:120px; flex-direction:column; align-items:stretch; padding:5px 12px; }
#ui-stamina-bar { width:100%; height:6px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden; }
#ui-stamina-fill { height:100%; width:100%; background:linear-gradient(90deg,#22c55e,#facc15); transition:width 0.15s; }
#ui-stamina-text { font-size:10px; opacity:0.85; margin-top:2px; text-align:center; }

#tool-indicator { position:absolute; left: calc(env(safe-area-inset-left) + 12px);
  bottom: calc(env(safe-area-inset-bottom) + 12px); background:rgba(0,0,0,0.55);
  padding:6px 12px; border-radius:16px; font-size:12px; font-weight:600; }
#tool-indicator > div:last-child { font-size:11px; opacity:0.8; margin-top:3px; }

#crosshair { position:absolute; top:50%; left:50%; width:6px; height:6px;
  transform:translate(-50%,-50%); background:rgba(255,255,255,0.75); border-radius:50%;
  box-shadow:0 0 4px rgba(0,0,0,0.6); transition:transform 0.15s; }
#crosshair.target { transform:translate(-50%,-50%) scale(1.6); background:#ffd35c; }

#prompt { position:absolute; top:58%; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
  font-size:13px; font-weight:600; white-space:nowrap; }
#prompt.hidden { display:none; }

#notifications { position:absolute; top:70px; right:12px;
  display:flex; flex-direction:column; gap:6px; align-items:flex-end; max-width:60vw; }
.notif { background:rgba(20,20,20,0.9); padding:8px 14px; border-radius:8px;
  font-size:12px; font-weight:600; border-left:3px solid #888;
  animation:slideIn 0.3s ease; }
.notif.rarity-common { border-color:#bbb; }
.notif.rarity-uncommon { border-color:#4ade80; }
.notif.rarity-rare { border-color:#60a5fa; }
.notif.rarity-epic { border-color:#c084fc; }
.notif.rarity-legendary { border-color:#fbbf24; box-shadow:0 0 20px rgba(251,191,36,0.5); }
.notif.rarity-mythic { border-color:#f43f5e; box-shadow:0 0 24px rgba(244,63,94,0.6); }
@keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }

#save-toast { position:absolute; top:70px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.8); padding:6px 16px; border-radius:20px;
  font-size:12px; font-weight:700; color:#ffd35c; transition:opacity 0.4s; }
#save-toast.hidden { display:none; }

/* ================= DISCOVERY POPUP ================= */
#discovery { position:absolute; top:32%; left:50%; transform:translate(-50%,-50%);
  z-index:5; pointer-events:none; }
#discovery.hidden { display:none; }
.disc-inner { background:rgba(0,0,0,0.85); padding:18px 32px; border-radius:16px;
  text-align:center; border:2px solid #fff; min-width:220px; }
.disc-inner.rarity-rare { border-color:#60a5fa; box-shadow:0 0 40px rgba(96,165,250,0.6); }
.disc-inner.rarity-epic { border-color:#c084fc; box-shadow:0 0 50px rgba(192,132,252,0.7); }
.disc-inner.rarity-legendary { border-color:#fbbf24; box-shadow:0 0 60px rgba(251,191,36,0.8); }
.disc-inner.rarity-mythic { border-color:#f43f5e; box-shadow:0 0 70px rgba(244,63,94,0.9); }
.disc-icon { font-size:38px; margin-bottom:6px; }
.disc-title { font-size:11px; letter-spacing:2px; font-weight:800; opacity:0.9; }
.disc-name { font-size:17px; font-weight:800; margin:6px 0; }
.disc-val { font-size:12px; color:#4ade80; font-weight:700; }
#discovery.play .disc-inner { animation:discPop 1.4s ease; }
@keyframes discPop {
  0% { transform:scale(0.5); opacity:0; }
  20% { transform:scale(1.08); opacity:1; }
  40% { transform:scale(1); }
  85% { transform:scale(1); opacity:1; }
  100% { transform:scale(0.95); opacity:0; }
}
body.level-flash::after { content:''; position:fixed; inset:0;
  background:radial-gradient(circle, rgba(255,211,92,0.4), transparent 70%);
  pointer-events:none; z-index:100; animation:flash 0.8s ease-out; }
@keyframes flash { from { opacity:1; } to { opacity:0; } }

/* ================= TOUCH LAYER ================= */
#look-area { position:fixed; inset:0; z-index:1; }

#joystick { position:fixed; left: calc(env(safe-area-inset-left) + 20px);
  bottom: calc(env(safe-area-inset-bottom) + 20px); width:130px; height:130px;
  border-radius:50%; background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.2); z-index:3; touch-action:none; }
#joystick-knob { position:absolute; left:50%; top:50%; width:55px; height:55px;
  border-radius:50%; background:rgba(255,255,255,0.35);
  transform:translate(-50%,-50%); pointer-events:none; }

#buttons { position:fixed; right: calc(env(safe-area-inset-right) + 16px);
  bottom: calc(env(safe-area-inset-bottom) + 16px); z-index:3;
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; }
.tbtn { width:62px; height:62px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.45);
  color:#fff; font-size:22px; font-weight:700; backdrop-filter:blur(4px);
  touch-action:none; display:flex; align-items:center; justify-content:center;
  -webkit-user-select:none; user-select:none; }
.tbtn.primary { background:rgba(255,180,50,0.4); border-color:#ffd35c; font-size:26px; }
.tbtn:active { transform:scale(0.92); background:rgba(255,255,255,0.25); }
#btn-action { grid-column:3; grid-row:2; width:72px; height:72px; }
#btn-jump { grid-column:1; grid-row:1; }
#btn-sprint { grid-column:2; grid-row:1; }
#btn-crouch { grid-column:3; grid-row:1; }
#btn-inv { grid-column:1; grid-row:2; }
#btn-shop { grid-column:2; grid-row:2; }

#quick-buttons { position:fixed; top: calc(env(safe-area-inset-top) + 70px);
  right: calc(env(safe-area-inset-right) + 10px); z-index:5;
  display:flex; flex-direction:column; gap:8px; }
.qbtn { width:42px; height:42px; border-radius:50%;
  background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,255,255,0.25);
  color:#fff; font-size:18px; display:flex; align-items:center;
  justify-content:center; backdrop-filter:blur(4px); touch-action:none; }
.qbtn:active { transform:scale(0.9); background:rgba(255,255,255,0.25); }

/* ================= PANELS ================= */
#panels { position:fixed; inset:0; z-index:10; pointer-events:none; }
.panel { position:absolute; inset:0; background:rgba(10,12,16,0.96);
  backdrop-filter:blur(10px); display:flex; flex-direction:column;
  pointer-events:auto; animation:fadeIn 0.2s; }
.panel.hidden { display:none; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.panel-head { display:flex; justify-content:space-between; align-items:center;
  padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
  border-bottom:1px solid rgba(255,255,255,0.1); }
.panel-head h2 { font-size:19px; }
.panel-head h2 small { font-size:12px; opacity:0.6; font-weight:500; }
.close-x { background:rgba(255,255,255,0.1); color:#fff; border:none;
  width:36px; height:36px; border-radius:50%; font-size:18px;
  display:flex; align-items:center; justify-content:center; }
.panel-tabs { display:flex; gap:6px; padding:10px 18px; }
.tab { flex:1; background:rgba(255,255,255,0.08); color:#ccc; border:none;
  padding:10px; border-radius:8px; font-weight:600; font-size:13px; }
.tab.active { background:#ffd35c; color:#1a1a1a; }
.panel-body { flex:1; overflow-y:auto; padding:12px 18px calc(env(safe-area-inset-bottom) + 20px);
  -webkit-overflow-scrolling:touch; }
.empty { text-align:center; opacity:0.5; padding:40px 0; font-size:14px; }

.item-row { display:flex; align-items:center; gap:10px; padding:10px;
  background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:8px;
  border-left:3px solid #555; }
.item-row .item-icon { width:42px; height:42px; border-radius:8px;
  background:rgba(255,255,255,0.1); display:flex; align-items:center;
  justify-content:center; font-size:22px; flex-shrink:0; }
.item-row .item-info { flex:1; min-width:0; }
.item-row .item-name { font-size:13px; font-weight:700; }
.item-row .item-name small { font-size:10px; opacity:0.6; font-weight:500; margin-right:6px; }
.item-row .item-desc { font-size:11px; opacity:0.65; margin-top:2px; }
.item-row .item-qty { font-size:13px; font-weight:700; color:#ffd35c; }
.item-row .row-actions { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
.item-action { background:#ffd35c; color:#1a1a1a; border:none;
  padding:7px 12px; border-radius:8px; font-weight:700; font-size:11px; white-space:nowrap; }
.item-action.alt { background:#60a5fa; color:#fff; }
.item-action:disabled { background:#333; color:#666; }
.rarity-common { border-left-color:#bbb; }
.rarity-uncommon { border-left-color:#4ade80; }
.rarity-rare { border-left-color:#60a5fa; }
.rarity-epic { border-left-color:#c084fc; }
.rarity-legendary { border-left-color:#fbbf24; }
.rarity-mythic { border-left-color:#f43f5e; }

.big-btn { width:100%; padding:14px; background:#4ade80; color:#0a1a0f;
  border:none; border-radius:10px; font-weight:700; font-size:14px; margin-top:10px; }
.big-btn.danger { background:#f43f5e; color:#fff; }
.panel label { display:block; margin:14px 0; font-size:14px; }
.panel input[type="range"] { width:100%; margin-top:8px; }
.panel input[type="checkbox"] { width:auto; margin-left:8px; }

/* ===== SKILLS ===== */
.skills-head { background:rgba(255,211,92,0.15); padding:10px 14px;
  border-radius:10px; margin-bottom:12px; font-size:14px; }
.skills-head b { color:#ffd35c; font-size:18px; }
.skill-cat { margin-bottom:16px; }
.skill-cat h3 { font-size:14px; opacity:0.85; margin-bottom:8px;
  padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.1); }
.skill-row { display:flex; gap:10px; padding:10px;
  background:rgba(255,255,255,0.05); border-radius:10px;
  margin-bottom:6px; border-left:3px solid #4ade80; }
.skill-row.locked { opacity:0.5; border-left-color:#666; }
.skill-icon { font-size:22px; flex-shrink:0; width:36px; text-align:center; }
.skill-info { flex:1; min-width:0; }
.skill-name { font-size:13px; font-weight:700; }
.skill-name small { opacity:0.6; font-size:11px; margin-right:6px; }
.skill-desc { font-size:11px; opacity:0.7; margin-top:2px; }
.skill-req { font-size:10px; color:#fbbf24; margin-top:3px; }
.skill-buy { background:#c084fc; color:#fff; border:none;
  padding:8px 12px; border-radius:8px; font-weight:700; font-size:11px;
  align-self:center; white-space:nowrap; }
.skill-buy:disabled { background:#333; color:#666; }

/* ===== MISSIONS ===== */
.mission-row { background:rgba(255,255,255,0.05); padding:12px;
  border-radius:10px; margin-bottom:8px; }
.mission-title { font-size:14px; font-weight:700; margin-bottom:4px; }
.mission-desc { font-size:12px; opacity:0.7; margin-bottom:8px; }
.mission-progress { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.mission-progress .bar { flex:1; height:6px; background:rgba(255,255,255,0.15);
  border-radius:4px; overflow:hidden; }
.mission-progress .bar .fill { height:100%; background:#4ade80; transition:width 0.3s; }
.mission-progress span { font-size:11px; opacity:0.8; }
.mission-reward { display:flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600; color:#ffd35c; }
.mission-reward .badge { background:rgba(255,255,255,0.1);
  padding:4px 10px; border-radius:6px; font-size:11px; color:#fff; margin-right:auto; }
.mission-reward .badge.wait { opacity:0.6; }
.mission-reward .item-action { margin-right:auto; }

/* ===== MACHINES ===== */
.machine-row { background:rgba(255,255,255,0.05); padding:12px;
  border-radius:10px; margin-bottom:10px; border-left:3px solid #c084fc; }
.machine-head { font-size:14px; font-weight:700; margin-bottom:6px; }
.machine-head .mi { font-size:18px; margin-left:6px; }
.machine-head small { font-size:11px; opacity:0.6; margin-right:6px; }
.machine-stat { font-size:12px; opacity:0.85; margin-bottom:4px; }
.machine-row .bar { height:8px; background:rgba(255,255,255,0.15);
  border-radius:4px; overflow:hidden; margin:6px 0; }
.machine-row .bar .fill { height:100%; background:linear-gradient(90deg,#c084fc,#22d3ee);
  transition:width 0.4s; }
.machine-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

/* ===== STATS ===== */
.stat-row { display:flex; justify-content:space-between; padding:10px 4px;
  border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; }
.stat-row b { color:#ffd35c; }

/* ===== AREAS ===== */
.area-row { background:rgba(255,255,255,0.05); padding:12px;
  border-radius:10px; margin-bottom:8px; border-left:3px solid #4ade80; }
.area-row.locked { opacity:0.55; border-left-color:#666; }
.area-head { font-size:14px; font-weight:700; margin-bottom:4px; }
.area-head small { font-size:11px; opacity:0.6; margin-right:6px; }
.area-desc { font-size:12px; opacity:0.7; margin-bottom:6px; }
.area-stats { font-size:11px; opacity:0.65; margin-bottom:8px; }

/* ===== ACHIEVEMENTS ===== */
.ach-row { display:flex; gap:10px; padding:10px;
  background:rgba(255,255,255,0.05); border-radius:10px;
  margin-bottom:6px; border-left:3px solid #666; }
.ach-row.unlocked { border-left-color:#fbbf24; background:rgba(251,191,36,0.08); }
.ach-icon { font-size:26px; flex-shrink:0; }
.ach-info { flex:1; min-width:0; }
.ach-name { font-size:13px; font-weight:700; }
.ach-desc { font-size:11px; opacity:0.7; margin:2px 0 6px; }
.ach-row .bar.small { height:4px; background:rgba(255,255,255,0.15);
  border-radius:3px; overflow:hidden; }
.ach-row .bar.small .fill { height:100%; background:#4ade80; }
.ach-prog { font-size:10px; opacity:0.6; margin-top:3px; }
.ach-badge { font-size:20px; color:#fbbf24; align-self:center; }

/* ================= TUTORIAL ================= */
#tutorial { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%);
  z-index:6; background:rgba(0,0,0,0.8); padding:16px 24px; border-radius:12px;
  font-size:14px; font-weight:600; text-align:center; max-width:80vw;
  pointer-events:none; }
#tutorial.hidden { display:none; }

/* ================= RESPONSIVE ================= */
@media (max-width: 500px) {
  .tbtn { width:56px; height:56px; font-size:20px; }
  #btn-action { width:64px; height:64px; }
  #joystick { width:110px; height:110px; }
  #joystick-knob { width:48px; height:48px; }
  .qbtn { width:38px; height:38px; font-size:16px; }
  .stat { font-size:12px; padding:5px 10px; }
  .panel-head h2 { font-size:17px; }
}

@media (max-height: 420px) {
  .qbtn { width:34px; height:34px; font-size:14px; }
  #quick-buttons { top: calc(env(safe-area-inset-top) + 58px); gap:5px; }
  .tbtn { width:52px; height:52px; font-size:18px; }
  #btn-action { width:58px; height:58px; }
  #joystick { width:100px; height:100px; }
  #joystick-knob { width:44px; height:44px; }
}
</style>
</head>
<body>

<div id="game-container"></div>

<div id="hud">
  <div id="stats">
    <div class="stat money"><span class="icon">$</span><span id="ui-money">50</span></div>
    <div class="stat"><span class="icon">★</span><span id="ui-level">Lv.1</span></div>
    <div class="stat xp">
      <div id="ui-xp-bar"><div id="ui-xp-fill"></div></div>
      <span id="ui-xp-text">0/100</span>
    </div>
    <div class="stat stamina">
      <div id="ui-stamina-bar"><div id="ui-stamina-fill"></div></div>
      <span id="ui-stamina-text">⚡ 100/100</span>
    </div>
  </div>

  <div id="tool-indicator">
    <div><span id="ui-tool">Bare Hands</span></div>
    <div id="ui-dur"></div>
  </div>

  <div id="crosshair"></div>
  <div id="prompt" class="hidden"></div>
  <div id="notifications"></div>
  <div id="discovery" class="hidden"></div>
  <div id="save-toast" class="hidden">SAVING...</div>
</div>

<div id="look-area"></div>

<div id="joystick"><div id="joystick-knob"></div></div>

<div id="buttons">
  <button class="tbtn primary" id="btn-action">⛏</button>
  <button class="tbtn" id="btn-jump">⤒</button>
  <button class="tbtn" id="btn-sprint">»</button>
  <button class="tbtn" id="btn-crouch">⌄</button>
  <button class="tbtn" id="btn-inv">🎒</button>
  <button class="tbtn" id="btn-shop">$</button>
</div>

<div id="quick-buttons">
  <button class="qbtn" id="btn-skills">🌟</button>
  <button class="qbtn" id="btn-missions">📋</button>
  <button class="qbtn" id="btn-machines">⚙</button>
  <button class="qbtn" id="btn-areas">🌍</button>
  <button class="qbtn" id="btn-ach">🏆</button>
  <button class="qbtn" id="btn-stats">📊</button>
  <button class="qbtn" id="btn-settings">⚙️</button>
</div>

<div id="panels">
  <div class="panel hidden" id="panel-inv">
    <div class="panel-head"><h2>Inventory <small id="ui-inv-count"></small></h2><button class="close-x">✕</button></div>
    <div class="panel-body" id="inv-list"></div>
  </div>

  <div class="panel hidden" id="panel-shop">
    <div class="panel-head"><h2>Shop</h2><button class="close-x">✕</button></div>
    <div class="panel-tabs">
      <button class="tab active" data-tab="sell">Sell</button>
      <button class="tab" data-tab="tools">Tools</button>
      <button class="tab" data-tab="machines">Machines</button>
    </div>
    <div class="panel-body" id="shop-body"></div>
  </div>

  <div class="panel hidden" id="panel-skills">
    <div class="panel-head"><h2>Skill Tree</h2><button class="close-x">✕</button></div>
    <div class="panel-body" id="skills-body"></div>
  </div>

  <div class="panel hidden" id="panel-missions">
    <div class="panel-head"><h2>Missions</h2><button class="close-x">✕</button></div>
    <div class="panel-tabs">
      <button class="tab active" data-tab="active">Active</button>
      <button class="tab" data-tab="done">Completed</button>
    </div>
    <div class="panel-body" id="missions-body"></div>

/* ==================== EVENT BUS ==================== */
class EventBus {
  constructor() { this.map = new Map(); }
  on(evt, fn) {
    if (!this.map.has(evt)) this.map.set(evt, []);
    this.map.get(evt).push(fn);
    return () => this.off(evt, fn);
  }
  off(evt, fn) {
    const arr = this.map.get(evt);
    if (arr) this.map.set(evt, arr.filter(f => f !== fn));
  }
  emit(evt, data) {
    const arr = this.map.get(evt);
    if (arr) for (const f of arr.slice()) {
      try { f(data); } catch (e) { console.error('[EventBus]', evt, e); }
    }
  }
}

};
const UPGRADE_COST = (basePrice, lvl) => Math.floor(basePrice * 0.5 * Math.pow(1.8, lvl));
const UPGRADE_MAX = 5;

class ToolSystem {
  constructor() { this.state = { hands: { owned:true, durability:0, level:1 } }; }
  get(id) { return TOOLS[id] || TOOLS.hands; }
  has(id) { return !!this.state[id]?.owned; }
  getLevel(id) { return this.state[id]?.level || 1; }
  getDur(id) { return this.state[id]?.durability ?? 0; }
  getMaxDur(id) {
    const t = TOOLS[id];
    if (!t || t.maxDur === 0) return Infinity;
    return Math.floor(t.maxDur * (1 + (this.getLevel(id) - 1) * 0.15));
  }
  getYield(id, toolPowerMult = 1) {
    const t = TOOLS[id] || TOOLS.hands;
    const lvlMult = 1 + (this.getLevel(id) - 1) * 0.12;
    return Math.floor(t.baseYield * lvlMult * toolPowerMult);
  }
  buy(id) {
    if (this.has(id)) return false;
    const t = TOOLS[id]; if (!t) return false;
    this.state[id] = { owned:true, durability:t.maxDur, level:1 };
    return true;
  }
  upgrade(id) {
    const s = this.state[id]; if (!s) return false;
    if (s.level >= UPGRADE_MAX) return false;
    s.level++;
    s.durability = this.getMaxDur(id);
    return true;
  }
  damage(id, amount) {
    const s = this.state[id]; if (!s || TOOLS[id].maxDur === 0) return;
    s.durability = Math.max(0, s.durability - amount);
  }
  isBroken(id) { return TOOLS[id].maxDur > 0 && this.getDur(id) <= 0; }
  repair(id) {
    const s = this.state[id]; if (!s) return 0;
    const max = this.getMaxDur(id);
    const missing = max - s.durability;
    const cost = Math.ceil(missing * 0.5 + TOOLS[id].price * 0.02);
    s.durability = max;
    return cost;
  }
  serialize() { return JSON.parse(JSON.stringify(this.state)); }
  deserialize(d) {
    if (!d || typeof d !== 'object') return;
    this.state = d;
    if (!this.state.hands) this.state.hands = { owned:true, durability:0, level:1 };
  }
  migrateLegacy(owned) {
    if (!Array.isArray(owned)) return;
    for (const id of owned) {
      if (!this.state[id]) this.state[id] = { owned:true, durability:TOOLS[id]?.maxDur || 0, level:1 };
    }
  }
}

class SkillTree {
  constructor() { this.levels = {}; this.points = 0; }
  getLevel(id) { return this.levels[id] || 0; }
  canBuy(id, playerLevel) {
    const s = SKILLS[id]; if (!s) return { ok:false, reason:'Unknown skill.' };
    if (this.points < s.cost) return { ok:false, reason:'Not enough skill points.' };
    if (playerLevel < s.reqLvl) return { ok:false, reason:`Requires level ${s.reqLvl}.` };
    if (this.getLevel(id) >= s.max) return { ok:false, reason:'Maxed.' };
    for (const r of s.requires) if (this.getLevel(r) < 1) return { ok:false, reason:`Requires ${SKILLS[r].name}.` };
    return { ok:true };
  }
  buy(id, playerLevel) {
    const c = this.canBuy(id, playerLevel);
    if (!c.ok) return c;
    this.points -= SKILLS[id].cost;
    this.levels[id] = this.getLevel(id) + 1;
    return { ok:true };
  }
  grant(n) { this.points += n; }

  machineCapMult()    { return 1 + this.getLevel('machineCapacity') * 0.20; }
  serialize() { return { levels: {...this.levels}, points: this.points }; }
  deserialize(d) {
    if (!d) return;
    this.levels = d.levels || {};
    this.points = d.points || 0;
  }
}

  constructor(game) { this.game = game; this.unlocked = {}; }
  check() {
    const stats = this.game.statistics;
    for (const a of ACHIEVEMENTS) {
      if (this.unlocked[a.id]) continue;
      const value = a.stat === '__level' ? this.game.state.level : stats.get(a.stat);
      if (value >= a.target) this._unlock(a);
    }

    this.unlocked[a.id] = true;
    const r = a.reward || {};
    const parts = [];
    if (r.xp)    { this.game.addXP(r.xp); parts.push(`+${r.xp} XP`); }

    this.game.ui.refresh();
  }

    this.game.ui.notify(`✅ ${m.title} — ${parts.join('  ')}`, 'rare');
    this.game.audio.play('mission');
    this.game.ui.refresh();
    return true;
  }
  check() {
    for (const m of MISSIONS) {
      if (this.claimed[m.id] || this.busy[m.id]) continue;
      if (this.getProgress(m) >= m.target) {
        this.busy[m.id] = true;
        this.game.ui.notify(`📋 Mission ready: ${m.title}`, 'rare');
        this.game.audio.play('notify');
      }
    }
  }
  serialize() { return { claimed: {...this.claimed}, busy: {...this.busy} }; }
  deserialize(d) { if (!d) return; this.claimed = d.claimed || {}; this.busy = d.busy || {}; }
}

/* ==================== AUDIO ==================== */
class AudioSystem {
  constructor() { this.ctx = null; this.master = null; this.enabled = true; this.lastPlay = {}; }
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
  _throttle(name, ms = 40) {
    const now = performance.now();
    if (this.lastPlay[name] && now - this.lastPlay[name] < ms) return true;
    this.lastPlay[name] = now; return false;
  }
  tone(freq, dur, type='sine', vol=0.2, slideTo=null) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  chord(freqs, dur = 0.3, vol = 0.15) { for (const f of freqs) this.tone(f, dur, 'triangle', vol); }
  play(name) {
    if (!this.enabled || !this.ctx) return;
    switch (name) {
      case 'removeHay': if (this._throttle('removeHay', 60)) return; this.tone(180 + Math.random()*60, 0.10, 'sawtooth', 0.10, 90); break;
      case 'findItem': this.tone(660, 0.12, 'triangle', 0.18); this.tone(880, 0.20, 'triangle', 0.14); break;
      case 'findRare': this.chord([660, 880, 1320], 0.35, 0.14); break;
      case 'findLegendary': this.chord([523, 659, 784, 1046], 0.55, 0.16); break;
      case 'levelUp': this.chord([523, 659, 784, 1046, 1318], 0.6, 0.18); break;
      case 'buy': this.tone(600, 0.08, 'square', 0.14); this.tone(900, 0.12, 'square', 0.12); break;
      case 'sell': this.tone(800, 0.06, 'square', 0.12); this.tone(1200, 0.10, 'square', 0.10); break;
      case 'notify': this.tone(880, 0.10, 'sine', 0.12); break;
      case 'mission': this.chord([659, 880], 0.35, 0.16); break;
      case 'achievement': this.chord([784, 988, 1175, 1568], 0.7, 0.18); break;
      case 'unlock': this.chord([440, 587, 740], 0.5, 0.16); break;
      case 'skillBuy': this.tone(523, 0.08, 'triangle', 0.16); this.tone(784, 0.14, 'triangle', 0.14); break;
      case 'broken': this.tone(150, 0.30, 'sawtooth', 0.20, 60); break;
      case 'click': this.tone(440, 0.04, 'sine', 0.10); break;
      case 'error': this.tone(220, 0.15, 'sawtooth', 0.15, 160); break;
    }
  }
}

/* ==================== SAVE SYSTEM ==================== */
class SaveSystem {
  constructor() { this.db = null; this.store = 'save'; }
  init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('haystack', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.store)) db.createObjectStore(this.store);
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = e => reject(e);
    });
  }
  save(key, value) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.store, 'readwrite');
      const req = tx.objectStore(this.store).put(value, key);
      req.onsuccess = () => resolve();
      req.onerror = e => reject(e);
    });
  }
  load(key) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.store, 'readonly');
      const req = tx.objectStore(this.store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e);
    });
  }
  clear() {
    return new Promise(resolve => {
      const tx = this.db.transaction(this.store, 'readwrite');
      tx.objectStore(this.store).clear();
      tx.oncomplete = () => resolve();
    });
  }
}

class Inventory {
  constructor(maxSlots = 24) { this.slots = []; this.maxSlots = maxSlots; }
  add(id, qty = 1) {
    const item = ITEMS[id];
    if (!item) return false;
    let slot = this.slots.find(s => s.id === id && s.qty < item.stack);
    if (slot) slot.qty += qty;
    else {
      if (this.slots.length >= this.maxSlots) return false;
      this.slots.push({ id, qty });
    }
    return true;
  }
  remove(id, qty = 1) {
    const slot = this.slots.find(s => s.id === id);
    if (!slot) return false;
    slot.qty -= qty;
    if (slot.qty <= 0) this.slots = this.slots.filter(s => s !== slot);
    return true;
  }
  count(id) { const s = this.slots.find(s => s.id === id); return s ? s.qty : 0; }
  serialize() { return this.slots.map(s => ({ ...s })); }
  deserialize(d) { this.slots = Array.isArray(d) ? d : []; }
}

/* ==================== STORAGE ==================== */
class Storage {
  constructor(capacity = 500) { this.capacity = capacity; this.items = {}; this.level = 1; }
  get total() { return Object.values(this.items).reduce((a, n) => a + n, 0); }
  get full() { return this.total >= this.capacity; }
  add(id, qty) {
    const room = this.capacity - this.total;
    const actual = Math.min(qty, room);
    if (actual > 0) this.items[id] = (this.items[id] || 0) + actual;
    return actual;
  }
  take(id, qty) {
    const have = this.items[id] || 0;
    const actual = Math.min(qty, have);
    if (actual > 0) { this.items[id] -= actual; if (this.items[id] <= 0) delete this.items[id]; }
    return actual;
  }
  serialize() { return { capacity: this.capacity, items: {...this.items}, level: this.level }; }
  deserialize(d) { if (!d) return; this.capacity = d.capacity || 500; this.items = d.items || {}; this.level = d.level || 1; }
}

/* ==================== MACHINES ==================== */
const MACHINE_TYPES = {
  mechRake: { id:'mechRake', name:'Mechanical Rake', icon:'🚜', price:8000, reqLevel:8, baseRate:12, baseCapacity:300, desc:'Automatically removes hay from one pile.' },
  conveyor: { id:'conveyor', name:'Hay Conveyor', icon:'🔗', price:25000, reqLevel:15, baseRate:40, baseCapacity:800, desc:'Processes hay faster. Feeds storage.' },
  separator:{ id:'separator',name:'Hay Separator', icon:'🧲', price:80000, reqLevel:22, baseRate:100, baseCapacity:2000, desc:'High-speed extraction with item sorting.' }
};

class Machine {
  constructor(type, targetPile) {
    this.type = type; this.targetPile = targetPile;
    this.level = 1; this.running = true;
    this.storage = { hay: 0 }; this.itemsFound = {};
    this._accum = 0; this.energy = 100;
  }
  get rate()    { return this.type.baseRate * (1 + (this.level - 1) * 0.35); }
  get capacity(){ return Math.floor(this.type.baseCapacity * (1 + (this.level - 1) * 0.5)); }
  get hayStored(){ return this.storage.hay; }
  get isFull()  { return this.hayStored >= this.capacity; }
  update(dt, skills, events) {
    if (!this.running || this.isFull) return;
    const speedMult = skills.machineSpeedMult();
    const amount = this.rate * speedMult * dt;
    this._accum += amount;
    const whole = Math.floor(this._accum);
    if (whole < 1) return;
    this._accum -= whole;
    if (!this.targetPile || this.targetPile.remaining <= 0) { this.running = false; return; }
    const center = this.targetPile.position.clone();
    center.y += this.targetPile.size.y * 0.4;
    const r = this.targetPile.removeAt(center, whole);
    if (r.removed > 0) {
      const cap = this.capacity;
      const addHay = Math.min(r.removed, cap - this.storage.hay);
      this.storage.hay += addHay;
      events.emit('hayRemoved', { amount: r.removed, machine: this });
      const found = this.targetPile.rollItems(r.removed);
      for (const f of found) {
        this.itemsFound[f.id] = (this.itemsFound[f.id] || 0) + f.qty;
        events.emit('itemFound', { id: f.id, qty: f.qty, machine: this });
      }
    }
  }
  upgrade() { this.level++; }
  upgradeCost() { return Math.floor(this.type.price * 0.6 * Math.pow(1.7, this.level)); }
  serialize() {
    return { typeId: this.type.id, level: this.level, running: this.running,
      storage: {...this.storage}, itemsFound: {...this.itemsFound}, energy: this.energy };
  }
}

class MachineManager {
  constructor(game) { this.game = game; this.machines = []; }
  canInstall(pile, typeId) {
    const t = MACHINE_TYPES[typeId]; if (!t) return { ok:false, reason:'Unknown.' };
    if (this.game.state.level < t.reqLevel) return { ok:false, reason:`Requires level ${t.reqLevel}.` };
    if (this.game.state.money < t.price) return { ok:false, reason:'Not enough money.' };
    return { ok:true };
  }
  install(typeId, pile) {
    const c = this.canInstall(pile, typeId); if (!c.ok) return c;
    const t = MACHINE_TYPES[typeId];
    this.game.state.money -= t.price;
    this.machines.push(new Machine(t, pile));
    this.game.statistics.inc('machinesBuilt', 1);
    this.game.ui.notify(`⚙ ${t.name} installed.`, 'rare');
    this.game.audio.play('unlock');
    this.game.ui.refresh();
    return { ok:true };
  }
  collect(machine) {
    const stored = machine.storage.hay;
    if (stored > 0) { this.game.inventory.add('hay', stored); machine.storage.hay = 0; }
    let count = 0;
    for (const [id, qty] of Object.entries(machine.itemsFound)) {
      this.game.inventory.add(id, qty); count += qty;
    }
    machine.itemsFound = {};
    if (stored > 0 || count > 0) {
      this.game.ui.notify(`📦 Collected ${stored} hay${count ? ` + ${count} items` : ''}.`, 'uncommon');
      this.game.audio.play('sell');
    }
  }
  update(dt) { for (const m of this.machines) m.update(dt, this.game.skills, this.game.events); }
  serialize() {
    const pileIdx = p => this.game.hayPiles.indexOf(p);
    return this.machines.map(m => ({ ...m.serialize(), pileIdx: pileIdx(m.targetPile) }));
  }
  deserialize(d) {
    if (!Array.isArray(d)) return;
    this.machines = [];
    for (const m of d) {
      const pile = this.game.hayPiles[m.pileIdx]; if (!pile) continue;
      const type = Object.values(MACHINE_TYPES).find(t => t.id === m.typeId); if (!type) continue;
      const machine = new Machine(type, pile);
      machine.level = m.level || 1;
      machine.running = !!m.running;
      machine.storage = m.storage || { hay:0 };
      machine.itemsFound = m.itemsFound || {};
      machine.energy = m.energy ?? 100;
      this.machines.push(machine);
    }
  }
}

/* ==================== HAY PILE ==================== */
const HAY_GEO = new THREE.BoxGeometry(0.35, 0.06, 0.09);
const HAY_MAT = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0.02 });

function mulberry32(a) {
  return function () {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

class HayPile {
  constructor(scene, position, count = 1200, size = { x:3, y:2.2, z:3 }, seed = 1) {
    this.scene = scene;
    this.position = position.clone();
    this.count = count; this.size = size; this.seed = seed;
    this.remaining = count;
    this.alive = new Uint8Array(count).fill(1);
    this.positions = new Float32Array(count * 3);
    this.ctx = { tier:0, itemMult:1, rareMult:1, precisionBonus:0, rareBonus:0, treasureBonus:0 };

    const rand = mulberry32(seed);
    const dummy = new THREE.Object3D();
    const mesh = new THREE.InstancedMesh(HAY_GEO, HAY_MAT.clone(), count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.castShadow = true; mesh.receiveShadow = true;

    const colorArr = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const t = Math.pow(rand(), 0.65);
      const py = t * size.y;
      const taper = 1 - t * 0.7;
      const angle = rand() * Math.PI * 2;
      const rad = Math.sqrt(rand()) * (size.x / 2) * taper;
      const px = Math.cos(angle) * rad;
      const pz = Math.sin(angle) * rad;
      this.positions[i * 3] = px;
      this.positions[i * 3 + 1] = py + 0.05;
      this.positions[i * 3 + 2] = pz;
      dummy.position.set(px, py + 0.05, pz);
      dummy.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
      dummy.scale.setScalar(0.85 + rand() * 0.4);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      const c = new THREE.Color().setHSL(0.125 + rand() * 0.02, 0.55, 0.5 + rand() * 0.15);
      colorArr[i*3] = c.r; colorArr[i*3+1] = c.g; colorArr[i*3+2] = c.b;
    }
    mesh.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);
    mesh.instanceMatrix.needsUpdate = true;
    mesh.position.copy(position);
    scene.add(mesh);
    this.mesh = mesh;

    this.proxy = new THREE.Mesh(
      new THREE.BoxGeometry(size.x * 1.05, size.y, size.z * 1.05),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    this.proxy.position.copy(position);
    this.proxy.position.y += size.y / 2;
    scene.add(this.proxy);
  }
  setSearchContext(c) { this.ctx = c; }
  removeAt(worldPoint, amount) {
    if (this.remaining <= 0) return { removed: 0 };
    const lx = worldPoint.x - this.position.x;
    const ly = worldPoint.y - this.position.y;
    const lz = worldPoint.z - this.position.z;
    const scored = [];
    for (let i = 0; i < this.count; i++) {
      if (!this.alive[i]) continue;
      const dx = this.positions[i*3] - lx;
      const dy = this.positions[i*3+1] - ly;
      const dz = this.positions[i*3+2] - lz;
      scored.push({ i, d: dx*dx + dy*dy + dz*dz });
    }
    scored.sort((a, b) => a.d - b.d);
    const remove = Math.min(amount, scored.length);
    if (remove === 0) return { removed: 0 };
    const dummy = new THREE.Object3D();
    dummy.position.set(0, -9999, 0); dummy.scale.setScalar(0); dummy.updateMatrix();
    for (let k = 0; k < remove; k++) {
      const idx = scored[k].i;
      this.alive[idx] = 0;
      this.mesh.setMatrixAt(idx, dummy.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    this.remaining -= remove;
    return { removed: remove };
  }
  rollItems(amount) {
    const ctx = this.ctx;
    const rolls = Math.max(1, Math.floor(amount / 4));
    const found = [];
    for (let r = 0; r < rolls; r++) {
      let roll = Math.random();
      roll -= ctx.precisionBonus * 0.03;
      if (roll < 0) roll = 0;
      const areaBoost = ctx.itemMult - 1;
      const rareBoost = ctx.rareBonus + ctx.treasureBonus;
      const t = ctx.tier;
      const th = {
        mythic:    Math.max(0.0001, 0.0004 + t * 0.0002 - rareBoost * 0.0001),
        legendary: Math.max(0.0008, 0.0030 + t * 0.0010 - rareBoost * 0.0005),
        epic:      Math.max(0.002,  0.0100 + t * 0.0030 - rareBoost * 0.0010),
        rare:      Math.max(0.008,  0.0350 + t * 0.0080 - rareBoost * 0.0020),
        uncommon:  0.1300 + t * 0.0150
      };
      let id = null;
      if (roll < th.mythic) id = 'mysteryNeedle';
      else if (roll < th.legendary) id = Math.random() < 0.4 ? 'ancientNeedle' : (Math.random() < 0.5 ? 'ancientObj' : 'treasurePiece');
      else if (roll < th.epic) id = Math.random() < 0.35 ? 'goldenNeedle' : (Math.random() < 0.5 ? 'goldObj' : 'silverObj');
      else if (roll < th.rare) id = Math.random() < 0.3 ? 'silverNeedle' : (Math.random() < 0.5 ? 'watch' : (Math.random() < 0.5 ? 'ring' : 'toolPart'));
      else if (roll < th.uncommon) id = ['coin','rope','scrap','metal','key','toy','needle'][Math.floor(Math.random()*7)];
      else if (roll < th.uncommon + 0.10 * areaBoost + 0.20) id = ['wood','cloth','bottle','button'][Math.floor(Math.random()*4)];
      else if (roll < th.uncommon + 0.45 * areaBoost + 0.55) id = 'straw';
      if (id) found.push(id);
    }
    const map = {};
    for (const id of found) map[id] = (map[id] || 0) + 1;
    return Object.entries(map).map(([id, qty]) => ({ id, qty }));
  }
  serialize() {
    return { seed:this.seed, count:this.count, size:this.size,
      position: this.position.toArray(), alive: Array.from(this.alive) };
  }
  deserialize(d) {
    if (!d || !d.alive) return;
    const dummy = new THREE.Object3D();
    dummy.position.set(0, -9999, 0); dummy.scale.setScalar(0); dummy.updateMatrix();
    let alive = 0;
    for (let i = 0; i < Math.min(this.count, d.alive.length); i++) {
      if (d.alive[i]) alive++;
      else { this.alive[i] = 0; this.mesh.setMatrixAt(i, dummy.matrix); }
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    this.remaining = alive;
  }
  dispose() {
    this.scene.remove(this.mesh);
    this.scene.remove(this.proxy);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
  }
}

class World {
  constructor(scene) { this.scene = scene; }
  build() {
    this.scene.add(new THREE.HemisphereLight(0xa8d8ff, 0x4a3a1a, 0.75));
    const sun = new THREE.DirectionalLight(0xfff2d0, 1.35);
    sun.position.set(30, 45, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    const s = sun.shadow.camera;
    s.left = -40; s.right = 40; s.top = 40; s.bottom = -40; s.near = 1; s.far = 120;
    sun.shadow.bias = -0.0005;
    this.scene.add(sun);
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.15));

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(220, 32, 16),
      new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide, fog: false })
    );
    this.scene.add(sky);
    this.scene.fog = new THREE.Fog(0xc8dff0, 60, 180);

    const grassTex = this.makeNoiseTexture('#5d8a3a', '#4a7530');
    grassTex.repeat.set(60, 60);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(240, 240, 1, 1),
      new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.scene.add(ground);

    const dirtTex = this.makeNoiseTexture('#8b6f47', '#6e5537');
    dirtTex.repeat.set(8, 8);
    const dirt = new THREE.Mesh(
      new THREE.CircleGeometry(22, 48),
      new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 })
    );
    dirt.rotation.x = -Math.PI / 2;
    dirt.position.y = 0.01;
    dirt.receiveShadow = true;
    this.scene.add(dirt);

    this.buildBarn(-14, 0, -14);
    this.buildWorkshop(14, 0, -12);
    this.buildSellStation(0, 0, -14);

    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 28 + Math.random() * 35;
      this.buildTree(Math.cos(a) * r, 0, Math.sin(a) * r);
    }
    this.buildFence();
    for (let i = 0; i < 6; i++) {
      const g = new THREE.Group();
      const crate = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.9, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.9 })
      );
      crate.position.y = 0.45; crate.castShadow = true; crate.receiveShadow = true;
      g.add(crate);
      g.position.set(-18 + Math.random() * 4, 0, 6 + Math.random() * 4);
      this.scene.add(g);
    }
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, fog: false });
    for (let i = 0; i < 14; i++) {
      const cloud = new THREE.Group();
      for (let j = 0; j < 3; j++) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(4 + Math.random() * 3, 8, 6), cloudMat);
        puff.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 4);
        cloud.add(puff);
      }
      cloud.position.set((Math.random() - 0.5) * 180, 40 + Math.random() * 20, (Math.random() - 0.5) * 180);
      this.scene.add(cloud);
    }
  }
  makeNoiseTexture(c1, c2) {
    const size = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = c1; ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < 2500; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? c2 : c1;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
    }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  buildBarn(x, y, z) {
    const g = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x9c3a2a, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c2e1a, roughness: 0.85 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.85 });
    const walls = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 12), wallMat);
    walls.position.y = 3; walls.castShadow = true; walls.receiveShadow = true;
    g.add(walls);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(8.5, 3.2, 4), roofMat);
    roof.position.y = 7.6; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
    g.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.2, 0.2), trimMat);
    door.position.set(0, 1.6, 6.05);
    g.add(door);
    g.position.set(x, y, z);
    this.scene.add(g);
  }
  buildWorkshop(x, y, z) {
    const g = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x6e6e6e, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.85 });
    const box = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 8), wallMat);
    box.position.y = 2; box.castShadow = true; box.receiveShadow = true;
    g.add(box);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 9), roofMat);
    roof.position.y = 4.2; roof.castShadow = true;
    g.add(roof);
    g.position.set(x, y, z);
    this.scene.add(g);
  }
  buildSellStation(x, y, z) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
    const counter = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.1, 1), mat);
    counter.position.y = 0.55; counter.castShadow = true; counter.receiveShadow = true;
    g.add(counter);
    const sign = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.7, 0.1),
      new THREE.MeshStandardMaterial({ color: 0xffd35c, emissive: 0x553300, emissiveIntensity: 0.4 }));
    sign.position.set(0, 2.2, 0);
    g.add(sign);
    g.position.set(x, y, z);
    this.scene.add(g);
  }
  buildTree(x, y, z) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.4, 3.2, 8),
      new THREE.MeshStandardMaterial({ color: 0x5a3a1e, roughness: 1 })
    );
    trunk.position.y = 1.6; trunk.castShadow = true;
    g.add(trunk);
    for (let i = 0; i < 2; i++) {
      const foliage = new THREE.Mesh(
        new THREE.SphereGeometry(1.8 - i * 0.3, 8, 6),
        new THREE.MeshStandardMaterial({ color: 0x2d5016 + i * 0x050500, roughness: 1 })
      );
      foliage.position.y = 3.6 + i * 1.1;
      foliage.castShadow = true;
      g.add(foliage);
    }
    g.position.set(x, y, z);
    this.scene.add(g);
  }
  buildFence() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 1 });
    const postGeo = new THREE.BoxGeometry(0.15, 1.3, 0.15);
    const railGeo = new THREE.BoxGeometry(3.0, 0.1, 0.08);
    const z = -22;
    for (let i = -21; i <= 21; i += 3) {
      const post = new THREE.Mesh(postGeo, mat);
      post.position.set(i, 0.65, z); post.castShadow = true;
      this.scene.add(post);
      if (i < 21) {
        for (const ry of [0.35, 0.9]) {
          const rail = new THREE.Mesh(railGeo, mat);
          rail.position.set(i + 1.5, ry, z); rail.castShadow = true;
          this.scene.add(rail);
        }
      }
    }
  }
}

/* ==================== INPUT ==================== */
class Input {
  constructor() {
    this.keys = {};
    this.move = { x: 0, y: 0 };
    this.look = { dx: 0, dy: 0 };
    this.buttons = { sprint: false, crouch: false, jump: false };
    this._jumpPressed = false;
    this._actionPressed = false;
    this.sensitivity = 0.0025;
    this.setupKeyboard();
  }
  setupKeyboard() {
    window.addEventListener('keydown', e => {
      if (!this.keys[e.code]) {
        if (e.code === 'Space') this._jumpPressed = true;
        if (e.code === 'KeyE') this._actionPressed = true;
      }
      this.keys[e.code] = true;
      if (['Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
  }
  isDown(c) { return !!this.keys[c]; }
  consumeJump() { const v = this._jumpPressed; this._jumpPressed = false; return v; }
  consumeAction() { const v = this._actionPressed; this._actionPressed = false; return v; }
  triggerAction() { this._actionPressed = true; }
  triggerJump() { this._jumpPressed = true; }
  getMoveVector() {
    let x = this.move.x, y = this.move.y;
    if (this.isDown('KeyW')) y -= 1;
    if (this.isDown('KeyS')) y += 1;
    if (this.isDown('KeyA')) x -= 1;
    if (this.isDown('KeyD')) x += 1;
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  }
  consumeLook() {
    const dx = this.look.dx, dy = this.look.dy;
    this.look.dx = 0; this.look.dy = 0;
    return { dx, dy };
  }
}

/* ==================== PLAYER ==================== */
class Player {
  constructor(camera, input) {
    this.camera = camera; this.input = input;
    this.position = new THREE.Vector3(0, 1.7, 8);
    this.vy = 0; this.yaw = 0; this.pitch = -0.1;
    this.walkSpeed = 4.0; this.sprintSpeed = 7.0; this.crouchSpeed = 2.0;
    this.eyeHeight = 1.7; this.crouchHeight = 1.05;
    this.currentHeight = this.eyeHeight;
    this.onGround = true;
    this.bobPhase = 0; this.bobIntensity = 0;
    this.crouching = false;
    this._shake = 0;
    this.maxStamina = 100;
    this.stamina = 100;
    this.exhausted = false;
  }
  addShake(amount = 0.15) { this._shake = Math.min(0.5, this._shake + amount); }
  setMaxStamina(v) {
    const ratio = this.maxStamina > 0 ? this.stamina / this.maxStamina : 1;
    this.maxStamina = v;
    this.stamina = ratio * v;
  }
  drainStamina(n) { this.stamina = Math.max(0, this.stamina - n); this.exhausted = this.stamina <= 0; }
  regenStamina(dt, rateMult = 1) {
    const base = 6 * rateMult;
    this.stamina = Math.min(this.maxStamina, this.stamina + base * dt);
    if (this.stamina > 20) this.exhausted = false;
  }
  update(dt) {
    const look = this.input.consumeLook();
    if (look.dx || look.dy) {
      this.yaw   -= look.dx * this.input.sensitivity;
      this.pitch -= look.dy * this.input.sensitivity;
    }
    const arrowSpeed = 2.0 * dt;
    if (this.input.isDown('ArrowLeft'))  this.yaw += arrowSpeed;
    if (this.input.isDown('ArrowRight')) this.yaw -= arrowSpeed;
    if (this.input.isDown('ArrowUp'))    this.pitch += arrowSpeed;
    if (this.input.isDown('ArrowDown'))  this.pitch -= arrowSpeed;
    this.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, this.pitch));

    if (this.input.isDown('KeyC') || this.input.buttons.crouch) this.crouching = true;
    else this.crouching = false;
    const targetHeight = this.crouching ? this.crouchHeight : this.eyeHeight;
    this.currentHeight += (targetHeight - this.currentHeight) * Math.min(1, dt * 12);

    const mv = this.input.getMoveVector();
    const wantSprint = (this.input.isDown('ShiftLeft') || this.input.buttons.sprint) && !this.crouching;
    const canSprint = wantSprint && !this.exhausted && this.stamina > 5;
    if (canSprint) this.drainStamina(dt * 15 * (this.maxStamina / 100));
    const sprint = canSprint;
    const speed = this.crouching ? this.crouchSpeed : (sprint ? this.sprintSpeed : this.walkSpeed);

    const forward = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
    const right   = new THREE.Vector3( Math.cos(this.yaw), 0, -Math.sin(this.yaw));
    const move = new THREE.Vector3();
    move.addScaledVector(forward, -mv.y);
    move.addScaledVector(right,   mv.x);
    const moving = move.lengthSq() > 0.001;
    if (moving) move.normalize();
    this.position.x += move.x * speed * dt;
    this.position.z += move.z * speed * dt;

    if (this.input.consumeJump() && this.onGround) { this.vy = 6.5; this.onGround = false; }
    this.vy -= 22 * dt;
    this.position.y += this.vy * dt;
    if (this.position.y <= this.currentHeight) {
      if (!this.onGround && this.vy < -4) this.addShake(0.1);
      this.position.y = this.currentHeight;
      this.vy = 0; this.onGround = true;
    }

    if (moving && this.onGround) {
      this.bobPhase += dt * (sprint ? 13 : 9);
      this.bobIntensity = Math.min(1, this.bobIntensity + dt * 4);
    } else {
      this.bobIntensity = Math.max(0, this.bobIntensity - dt * 4);
    }
    const bobY = Math.sin(this.bobPhase) * 0.055 * this.bobIntensity;
    const bobX = Math.cos(this.bobPhase * 0.5) * 0.03 * this.bobIntensity;

    this._shake = Math.max(0, this._shake - dt * 2);
    const shakeX = (Math.random() - 0.5) * this._shake * 0.4;
    const shakeY = (Math.random() - 0.5) * this._shake * 0.4;

    this.camera.position.set(
      this.position.x + bobX + shakeX,
      this.position.y + bobY + shakeY,
      this.position.z
    );
    this.camera.rotation.order = 'YXZ';
    this.camera.rotation.y = this.yaw;
    this.camera.rotation.x = this.pitch;
  }
  serialize() { return { position: this.position.toArray(), yaw: this.yaw, pitch: this.pitch, stamina: this.stamina, maxStamina: this.maxStamina }; }
  deserialize(d) {
    if (!d) return;
    if (d.position) this.position.set(...d.position);
    if (typeof d.yaw === 'number') this.yaw = d.yaw;
    if (typeof d.pitch === 'number') this.pitch = d.pitch;
    if (typeof d.maxStamina === 'number') this.maxStamina = d.maxStamina;
    if (typeof d.stamina === 'number') this.stamina = d.stamina;
  }
}
