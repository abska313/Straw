<head>

<title>HAYSTACK — محاكي البحث في القش</title>
<style>
@import url("https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-400-normal.css");
@import url("https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-700-normal.css");
@import url("https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-900-normal.css");
:root{
  --amber:#ffb52e; --amber2:#ff8c1a; --green:#7ec850; --panel:#1c150dee;
  --panel2:#241a10ee; --line:#5a442666; --txt:#f5e9d0; --dim:#c9b490;
  --rc:#9aa4ad;--ru:#4caf50;--rr:#2f9bff;--re:#c05cff;--rl:#ff9800;--rm:#ff4d5e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06;font-family:'Cairo',system-ui,sans-serif;color:var(--txt);touch-action:none;overscroll-behavior:none}
canvas{display:block}
#app{position:fixed;inset:0}
#app canvas{position:absolute;inset:0;z-index:0}
#touch-layer{position:absolute;inset:0;z-index:1}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
.hide{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:4;pointer-events:none}
#hud .chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 12px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;font-weight:700}
#top-bar{position:absolute;top:calc(8px + var(--sat));right:calc(10px + var(--sar));left:calc(10px + var(--sal));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#stat-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#money-chip{color:#ffd76a;font-size:16px}
#lvl-chip{flex-direction:column;align-items:flex-start;gap:2px;padding:4px 12px;font-size:12px}
#xp-bar{width:110px;height:6px;background:#0008;border-radius:4px;overflow:hidden}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#7ec850,#c8ff5e);border-radius:4px;transition:width .3s}
#stamina-wrap{flex-direction:column;align-items:flex-start;gap:2px;padding:4px 12px;font-size:11px}
#sta-bar{width:90px;height:7px;background:#0008;border-radius:4px;overflow:hidden}
#sta-fill{height:100%;width:100%;background:linear-gradient(90deg,#38c8f0,#7ef0ff);border-radius:4px}
#sta-fill.low{background:linear-gradient(90deg,#ff5b4d,#ff9d5c)}
#tool-chip{font-size:12px;color:var(--dim)}
#tool-chip b{color:var(--amber)}
#menu-col{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.menu-btn{width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;position:relative;backdrop-filter:blur(6px)}
.menu-btn:active{transform:scale(.92);background:var(--panel2)}
#btn-install{background:linear-gradient(135deg,#ffb52e,#ff8c1a);color:#3a2405;display:none;font-size:18px;font-weight:900}
.badge{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:#ff5252;border:2px solid #1c150d;display:none}
.badge.on{display:block}
#crosshair{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffffffcc;box-shadow:0 0 6px #000a}
#prompt{position:absolute;bottom:calc(172px + var(--sab));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);color:var(--amber);border-radius:20px;padding:6px 18px;font-weight:700;font-size:14px;display:none;white-space:nowrap;animation:pulse 1.4s infinite;backdrop-filter:blur(6px)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffb52e55}50%{box-shadow:0 0 0 9px #ffb52e00}}

/* ---------- أزرار التحكم ---------- */
#joy-zone{position:absolute;left:0;bottom:0;width:44vw;height:62vh;z-index:2}
#joy-base{position:absolute;width:118px;height:118px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30;display:none;transform:translate(-50%,-50%)}
#joy-knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffcf7acc;border:2px solid #fff8;transform:translate(-50%,-50%);box-shadow:0 4px 12px #0007}
#btn-cluster{position:absolute;right:calc(12px + var(--sar));bottom:calc(14px + var(--sab));z-index:3;display:grid;grid-template-columns:repeat(2,64px);grid-auto-rows:64px;gap:10px}
.cbtn{border-radius:50%;background:#1c150dcc;border:2px solid #5a4426aa;color:var(--txt);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(4px);touch-action:none}
.cbtn small{font-size:9px;font-weight:700;opacity:.85}
.cbtn:active,.cbtn.active{background:#ffb52e33;border-color:var(--amber);transform:scale(.94)}
#btn-action{position:absolute;right:calc(96px + var(--sar));bottom:calc(84px + var(--sab));width:84px;height:84px;border-radius:50%;background:linear-gradient(160deg,#ffb52e,#ff8c1a);color:#3a2405;font-size:30px;border:3px solid #ffe0a0;box-shadow:0 6px 18px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;touch-action:none}
#btn-action small{font-size:10px;font-weight:900}
#btn-action:active{transform:scale(.93)}

/* ---------- الدرس ---------- */
#tut-bar{position:absolute;top:calc(64px + var(--sat));left:50%;transform:translateX(-50%);z-index:4;background:var(--panel2);border:1px solid var(--amber);border-radius:16px;padding:8px 16px;display:flex;align-items:center;gap:12px;max-width:88vw;backdrop-filter:blur(8px)}
#tut-text{font-size:13px;font-weight:700}
#tut-skip{pointer-events:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
#tut-dots{display:flex;gap:4px}
#tut-dots i{width:7px;height:7px;border-radius:50%;background:#5a4426}
#tut-dots i.done{background:var(--amber)}

/* ---------- toasts ---------- */
#toasts{position:absolute;top:calc(100px + var(--sat));left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1c150df0;border:1px solid var(--line);border-radius:14px;padding:6px 16px;font-size:13px;font-weight:700;animation:tin .25s ease;max-width:82vw;text-align:center}
.toast.gold{border-color:var(--amber);color:var(--amber)}
.toast.bad{border-color:#ff5252;color:#ff8a80}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

/* ---------- اكتشاف نادر ---------- */
#discovery{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:#000000aa;opacity:0;pointer-events:none;transition:opacity .3s}
#discovery.on{opacity:1}
#disc-card{background:linear-gradient(160deg,#2a1f12,#171009);border:2px solid var(--rc);border-radius:22px;padding:22px 40px;text-align:center;position:relative;overflow:hidden;animation:dpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dpop{from{transform:scale(.5);opacity:0}}
#disc-card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff33 50%,transparent 70%);animation:shine 1.6s infinite}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
#disc-icon{font-size:56px;filter:drop-shadow(0 0 14px currentColor)}
#disc-rarity{font-size:12px;font-weight:900;letter-spacing:2px}
#disc-name{font-size:22px;font-weight:900;margin:4px 0}
#disc-desc{font-size:12px;color:var(--dim)}

/* ---------- النوافذ ---------- */
#modal-root{position:absolute;inset:0;z-index:10;display:none}
#modal-root.on{display:block}
#backdrop{position:absolute;inset:0;background:#0009}
.sheet{position:absolute;right:0;left:0;bottom:0;top:auto;max-height:82vh;background:var(--panel2);border-top:2px solid var(--amber);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sheetUp .28s cubic-bezier(.2,1,.3,1);backdrop-filter:blur(12px);padding-bottom:var(--sab)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;color:var(--amber)}
.x-btn{width:36px;height:36px;border-radius:12px;background:#ffffff12;font-size:16px}
.sheet-b{overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:8px;padding:10px 14px 0}
.tab{flex:1;padding:8px;border-radius:12px;background:#ffffff0d;font-weight:700;font-size:13px;border:1px solid transparent}
.tab.on{background:#ffb52e22;border-color:var(--amber);color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;background:#ffffff0a;border:2px solid #ffffff14;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:24px}
.slot .q{position:absolute;bottom:2px;left:5px;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.slot.empty{opacity:.35;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:9px 12px;margin-bottom:8px}
.row .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2px solid var(--rc)}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:900;font-size:13px}
.row .ds{font-size:11px;color:var(--dim);line-height:1.35}
.row .st{font-size:10.5px;color:#8fd0ff;margin-top:2px}
.btn{border-radius:12px;padding:8px 14px;font-weight:900;font-size:12px;background:linear-gradient(160deg,#ffb52e,#ff8c1a);color:#3a2405;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.alt{background:#ffffff14;color:var(--txt)}
.btn.grn{background:linear-gradient(160deg,#8ee06a,#4caf50);color:#0d2a08}
.btn:disabled{opacity:.4;transform:none}
.pbar{height:8px;background:#0007;border-radius:5px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd76a);border-radius:5px}
#weight-bar{height:9px;background:#0007;border-radius:5px;overflow:hidden;margin:4px 14px 10px}
#weight-fill{height:100%;background:linear-gradient(90deg,#8ee06a,#ffd76a);width:0%}
.wlabel{font-size:11px;color:var(--dim);padding:0 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #ffffff0d;font-size:13px;font-weight:700;gap:10px}
.set-row input[type=range]{flex:1;accent-color:var(--amber)}
.set-row select{background:#2a1f12;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:inherit}
.toggle{min-width:74px;padding:7px;border-radius:12px;background:#ffffff12;font-weight:900;font-size:12px;text-align:center}
.toggle.on{background:#8ee06a33;color:#8ee06a;border:1px solid #8ee06a}
.detail-pop{position:absolute;inset:0;background:#171009f2;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px;z-index:2;animation:sheetUp .22s}
#loading{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 100% at 50% 20%,#3a2a12,#120c06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#logo{width:150px;height:150px;border-radius:34px;box-shadow:0 10px 40px #000a,0 0 0 3px #ffb52e55}
#loading h1{font-size:34px;font-weight:900;letter-spacing:4px;color:var(--amber);text-shadow:0 3px 0 #7a4a00}
#load-tip{font-size:12px;color:var(--dim);max-width:70vw;text-align:center}
#load-bar{width:200px;height:7px;background:#ffffff14;border-radius:5px;overflow:hidden}
#load-fill{height:100%;width:5%;background:linear-gradient(90deg,var(--amber),#ffd76a);transition:width .3s}
#rotate-hint{display:none;position:fixed;inset:0;z-index:60;background:#120c06f0;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;text-align:center;padding:20px}
#rotate-hint .ph{font-size:52px;animation:rot 1.6s infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){ #rotate-hint{display:flex} }
#fps-tag{position:absolute;bottom:calc(4px + var(--sab));left:calc(8px + var(--sal));z-index:4;font-size:10px;color:#ffffff55;pointer-events:none}
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ================= [PWA REGISTRATION] ================= */
let deferredPrompt = null;
if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg fail:', err));
  });
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById('btn-install');
  if (b) b.style.display = 'flex';
});
const installBtn = document.getElementById('btn-install');
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    } else {
      UI.toast('لتثبيت التطبيق: افتح خيارات المتصفح واضغط "إضافة إلى الشاشة الرئيسية"');
    }
  });
}

/* ================= [CORE] helpers ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':(''+Math.round(n*10)/10);
const Bus={m:{},on(e,f){(this.m[e]=this.m[e]||[]).push(f)},emit(e,...a){(this.m[e]||[]).forEach(f=>f(...a))}};

/* ================= [ITEMS] DB ================= */
const RARITY={common:{n:'شائع',c:'#9aa4ad',xp:15},uncommon:{n:'غير شائع',c:'#4caf50',xp:40},rare:{n:'نادر',c:'#2f9bff',xp:120},epic:{n:'ملحمي',c:'#c05cff',xp:320},legendary:{n:'أسطوري',c:'#ff9800',xp:900},mythic:{n:'خرافي',c:'#ff4d5e',xp:2200}};
const ITEMS={
 hay:{n:'قش',d:'قش ذهبي جاف. بِعه في منصة البيع.',v:.5,w:.05,r:'common',s:9999,i:'🌾',c:'res'},

 needle:{n:'إبرة',d:'الإبرة المفقودة! وجدتها.',v:40,w:.01,r:'uncommon',s:99,i:'🪡',c:'rare'},
 needleSilver:{n:'إبرة فضية',d:'إبرة مصنوعة من الفضة الخالصة.',v:260,w:.01,r:'rare',s:99,i:'🪡',c:'rare'},
 needleGold:{n:'إبرة ذهبية',d:'إبرة من الذهب الخالص. نادرة جدًا.',v:1300,w:.02,r:'epic',s:99,i:'🪡',c:'rare'},
 needleRare:{n:'إبرة نادرة',d:'إبرة قديمة بنقوش غامضة.',v:5200,w:.02,r:'legendary',s:99,i:'🪡',c:'rare'},
 needleAncient:{n:'إبرة عتيقة',d:'قطعة أثرية لا تقدّر بثمن.',v:16000,w:.03,r:'mythic',s:99,i:'🪡',c:'rare'},
 needleMystery:{n:'إبرة غامضة',d:'لا أحد يعرف مصدرها…',v:600,w:.01,r:'rare',s:99,i:'🪡',c:'rare'},
 coin:{n:'عملة معدنية',d:'عملة لامعة ضائعة.',v:35,w:.01,r:'common',s:250,i:'🪙',c:'rare'},
 coinOld:{n:'عملة قديمة',d:'عملة أثرية قيمة.',v:180,w:.01,r:'uncommon',s:250,i:'🪙',c:'rare'},
 jewelry:{n:'جوهرة',d:'حجر كريم مفقود.',v:320,w:.05,r:'rare',s:99,i:'💎',c:'rare'},

 treasure:{n:'كنز صغير',d:'صندوق صغير مليء بالمجوهرات!',v:2600,w:.5,r:'legendary',s:20,i:'🧰',c:'rare'},
};

const SaveSys={db:null,ok:false,
 init(){return new Promise(res=>{try{const r=indexedDB.open('haystack-db',1);
  r.onupgradeneeded=e=>{try{e.target.result.createObjectStore('kv')}catch(_){}};
  r.onsuccess=e=>{this.db=e.target.result;this.ok=true;res(true)};
  r.onerror=()=>{this.ok=false;res(false)};r.onblocked=()=>res(false);}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(this.ok&&this.db){try{const t=this.db.transaction('kv').objectStore('kv').get(k);
  t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(this.lsGet(k));}catch(e){res(this.lsGet(k))}}else res(this.lsGet(k))})},
 set(k,v){if(this.ok&&this.db){try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
  t.onerror=()=>this.lsSet(k,v);return}catch(e){}}return this.lsSet(k,v)},
 del(k){try{if(this.ok&&this.db)this.db.transaction('kv','readwrite').objectStore('kv').delete(k);localStorage.removeItem('hs-'+k)}catch(e){}},
 lsGet(k){try{return JSON.parse(localStorage.getItem('hs-'+k))}catch(e){return null}},
 lsSet(k,v){try{localStorage.setItem('hs-'+k,JSON.stringify(v));return true}catch(e){return false}}
};

   const rng=mulberry32(def.seed);const mesh=new THREE.InstancedMesh(this.geo,this.mat,n);
   const pos=new Float32Array(n*3),alive=new Uint8Array(n).fill(1),M=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),P=new THREE.Vector3(),SC=new THREE.Vector3(),C=new THREE.Color();
   for(let i=0;i<n;i++){const rad=def.R*Math.pow(rng(),.6),a=rng()*Math.PI*2;
    const x=def.x+Math.cos(a)*rad,z=def.z+Math.sin(a)*rad;
    const hMax=def.H*(1-Math.pow(rad/def.R,2));const y=.06+hMax*Math.pow(rng(),.8);
    E.set((rng()-.5)*1.3,rng()*Math.PI,(rng()-.5)*1.3);Q.setFromEuler(E);

   mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
   mesh.castShadow=true;mesh.receiveShadow=true;try{mesh.computeBoundingSphere()}catch(e){mesh.frustumCulled=false}
   scene.add(mesh);
   const pile={def,mesh,pos,alive,n,aliveCount:n,order:null};
   const orng=mulberry32(def.seed*31+7);const ord=[...Array(n).keys()];
   for(let i=n-1;i>0;i--){const j=Math.floor(orng()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}pile.order=ord;
   this.piles.push(pile);addCol(def.x,def.z,def.R*.55);

 },

  const sleeve=new THREE.MeshStandardMaterial({color:0x5a6b4a,roughness:.9});
  const mkArm=x=>{const g=new THREE.Group();const a=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.34),sleeve);a.position.z=-.05;
   const h=new THREE.Mesh(new THREE.BoxGeometry(.085,.085,.1),skin);h.position.z=-.26;g.add(a,h);g.position.set(x,-.06,0);return g};
  this.root.add(mkArm(-.14),mkArm(.14));
  this.toolG=new THREE.Group();this.toolG.position.set(.14,-.05,-.28);this.root.add(this.toolG);
  this.root.position.set(.26,-.34,-.48);camera.add(this.root);this.setTool(S.equipped)},
 setTool(id){this.toolG.clear();const wood=new THREE.MeshStandardMaterial({color:0x8a5a33,roughness:.9});
  const metal=new THREE.MeshStandardMaterial({color:0x9aa2aa,metalness:.7,roughness:.35});let g=this.toolG;
  const handle=len=>{const h=new THREE.Mesh(new THREE.CylinderGeometry(.022,.028,len,8),wood);h.rotation.x=Math.PI/2*.85;g.add(h);return h};
  if(id==='stick'){handle(.7)}
  else if(id==='rakeS'||id==='rakeL'){const w=id==='rakeL'?.34:.22;handle(.85);
   const bar=new THREE.Mesh(new THREE.BoxGeometry(w,.03,.03),metal);bar.position.set(0,.02,-.4);g.add(bar);
   for(let i=0;i<(id==='rakeL'?7:5);i++){const t=new THREE.Mesh(new THREE.BoxGeometry(.015,.12,.015),metal);
    t.position.set(-w/2+i*(w/(id==='rakeL'?6:4)),.02,-.43);g.add(t)}}
  else if(id==='fork'){handle(.85);for(let i=-1;i<=1;i++){const t=new THREE.Mesh(new THREE.CylinderGeometry(.012,.008,.3,6),metal);
   t.rotation.x=.5;t.position.set(i*.06,.06,-.44);g.add(t)}}
  else if(id==='shovel'){handle(.8);const b=new THREE.Mesh(new THREE.BoxGeometry(.16,.02,.2),metal);b.position.set(0,.02,-.44);b.rotation.x=.4;g.add(b)}
  else if(id==='magnet'){const red=new THREE.MeshStandardMaterial({color:0xd33,metalness:.5,roughness:.4});
   const u=new THREE.Mesh(new THREE.TorusGeometry(.08,.03,8,14,Math.PI),red);u.position.set(0,.05,-.32);u.rotation.z=Math.PI;g.add(u);
   handle(.3)}
  else if(id==='vacuum'){const body=new THREE.Mesh(new THREE.BoxGeometry(.14,.16,.3),new THREE.MeshStandardMaterial({color:0xc86432,roughness:.6}));
   body.position.set(0,.02,-.3);g.add(body);const tube=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.3,8),metal);
   tube.rotation.x=1.2;tube.position.set(0,0,-.46);g.add(tube)}
  else{
   const f=new THREE.Mesh(new THREE.BoxGeometry(.06,.05,.07),new THREE.MeshStandardMaterial({color:0xd9a377}));f.position.set(0,0,-.05);g.add(f)}},
 swing(){this.animOn=true;this.anim=0;AudioSys.swing()},
 update(dt,spd){if(!this.root)return;if(this.animOn){this.anim+=dt/this.animDur;
   if(this.anim>=1){this.animOn=false;this.anim=0}}
  const t=this.anim,k=Math.sin(Math.min(1,t)*Math.PI);
  this.root.rotation.x=-k*.95+Math.sin(Player.bobT)*.02*spd;
  this.root.position.z=-.48+k*.12;this.root.position.y=-.34+Math.abs(Math.sin(Player.bobT))*.012*spd+k*.03;
  this.root.position.x=.26+Math.sin(Player.bobT*.5)*.008*spd}};

let hover=null,raycaster=new THREE.Raycaster(),hoverTimer=0;
raycaster.far=7;
function updateHover(dt){hoverTimer-=dt;
 if(UI.modalOpen){UI.prompt(null);if(reticle)reticle.visible=false;return}
 let zone=null;for(const z of ZONES){if(Math.hypot(Player.pos.x-z.x,Player.pos.z-z.z)<z.r)zone=z}
 if(zone&&hoverTimer<=0){hover={type:'zone',zone};UI.prompt(zone.icon+' '+zone.label+' — اضغط ⛏');if(reticle)reticle.visible=false;return}
 if(hoverTimer>0){if(hover&&hover.type==='hay')UI.prompt('⛏ إزالة القش (سعة '+effTool().cap+')');return}
 hoverTimer=.12;
 const near=Hay.nearest(Player.pos.x,Player.pos.z,4.5);
 if(!near||near.aliveCount===0){hover=null;UI.prompt(null);if(reticle)reticle.visible=false;return}
 const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(Player.pitch,Player.yaw,0,'YXZ'));
 raycaster.set(camera.position,dir);
 const hits=raycaster.intersectObject(near.mesh,false);
 const hit=hits.find(h=>near.alive[h.instanceId]);
 if(hit&&hit.distance<4.2){hover={type:'hay',pile:near,point:hit.point.clone()};
  UI.prompt('⛏ إزالة القش (سعة '+effTool().cap+')');
  if(reticle){reticle.visible=true;reticle.position.copy(hit.point).addScaledVector(dir,-.05);reticle.quaternion.copy(camera.quaternion)}}
 else{hover=null;UI.prompt(null);if(reticle)reticle.visible=false}}
let actionCd=0;
function doInteract(){if(UI.modalOpen)return;updateHover(1);if(!hover)return;
 if(hover.type==='zone'){Modals.open(hover.zone.id==='sell'?'sell':'shop');return}
 if(hover.type==='hay')tryRemove(hover)}
function tryRemove(h){const tool=effTool();
 if(actionCd>0)return;
 if(Player.stamina<tool.stam){UI.toast('أنت مرهق! استرح قليلًا','bad');AudioSys.deny();return}
 const space=S.bagCap-invWeight();
 if(space<ITEMS.hay.w){UI.toast('الحقيبة ممتلئة! بِع القش في منصة البيع 💰','bad');AudioSys.deny();return}
 const pile=h.pile;
 const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(Player.pitch,Player.yaw,0,'YXZ'));
 raycaster.set(camera.position,dir);const hits=raycaster.intersectObject(pile.mesh,false);
 const hit=hits.find(x=>pile.alive[x.instanceId]);const point=hit?hit.point:h.point;
 const res=Hay.removeAt(pile,point,tool.cap);
 if(res.n===0)return;
 actionCd=tool.cd;Player.stamina=Math.max(0,Player.stamina-tool.stam);
 Hands.swing();AudioSys.hay();Player.pitchKick=-.012;Player.shake(.02);
 Particles.burst(point,Math.min(14,6+res.n),0xd8b25a,1.8,2.2);
 const added=invAdd('hay',res.n);
 S.stats.hayRemoved+=res.n;gainXP(Math.ceil(res.n/2));
 const strawN=Math.round(res.n*.12);if(strawN>0)invAdd('straw',strawN);
 if(added<res.n)UI.toast('الحقيبة امتلأت أثناء الجمع!','bad');
 rollLoot(pile,res.n,point,tool);
 Bus.emit('inv');Bus.emit('stat');scheduleSave()}
function chancePerPiece(p,n){return 1-Math.pow(1-p,n)}
function rollLoot(pile,n,point,tool){let drops=0;
 if(pile.def.id==='p0'&&!S.pityDone){S.pity+=n;
  if(S.pity>=30){S.pityDone=true;Pickups.spawn('needle',point);return}}
 for(const[id,p,tag]of LOOT_TABLE){if(drops>=3)break;
  let pp=p*(1+tool.rar);if(tag==='metal')pp*=tool.metal;
  if(Math.random()<chancePerPiece(pp,n)){Pickups.spawn(id,point);drops++}}}

let tutAcc=0;
function tutUpdate(dt){if(!S||S.tut>=TUT.length){$('tut-bar').classList.add('hide');return}
 $('tut-bar').classList.remove('hide');$('tut-text').textContent=TUT[S.tut];
 const dots=$('tut-dots');if(dots.childElementCount!==TUT.length){dots.innerHTML='';TUT.forEach(()=>dots.appendChild(document.createElement('i')))}
 [...dots.children].forEach((d,i)=>d.classList.toggle('done',i<=S.tut));
 let done=false;
 switch(S.tut){
  case 0:tutAcc+=Math.hypot(Input.joy.x,Input.joy.y)*dt;if(tutAcc>1.5)done=true;break;
  case 1:if(Player.lookDist>160)done=true;break;
  case 2:if(Hay.piles.some(p=>Math.hypot(Player.pos.x-p.def.x,Player.pos.z-p.def.z)<p.def.R+2.5))done=true;break;
  case 3:if(S.stats.hayRemoved>=1)done=true;break;
  case 4:if(S.stats.needles>=1)done=true;break;
  case 5:if(S.stats.soldValue>0)done=true;break;
  case 6:if(S.stats.toolsBought>=1)done=true;break}
 if(done){S.tut++;AudioSys.coin();UI.toast('✔ خطوة مكتملة','gold');
  if(S.tut>=TUT.length){UI.toast('انتهى الدرس! المزرعة ملكك الآن 🎉','gold');$('tut-bar').classList.add('hide')}
  scheduleSave()}}
$('tut-skip').onclick=()=>{S.tut=TUT.length;$('tut-bar').classList.add('hide');scheduleSave()};

  w.appendChild(mk('مجال الرؤية (FOV)',fov));
  const q=document.createElement('select');['low','med','high'].forEach(v=>{const o=document.createElement('option');
   o.value=v;o.textContent={low:'منخفض (أداء أعلى)',med:'متوسط',high:'عالي'}[v];if(S.settings.quality===v)o.selected=true;q.appendChild(o)});
  q.onchange=()=>{applyQuality(q.value);UI.toast('تم تطبيق جودة الرسوميات')};
  w.appendChild(mk('جودة الرسوميات',q));
  const aud=document.createElement('button');aud.className='toggle'+(S.settings.audio?' on':'');aud.textContent=S.settings.audio?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف';
  aud.onclick=()=>{S.settings.audio=!S.settings.audio;AudioSys.on=S.settings.audio;
   if(AudioSys.master)AudioSys.master.gain.value=S.settings.audio?.5:0;
   aud.className='toggle'+(S.settings.audio?' on':'');aud.textContent=S.settings.audio?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف';scheduleSave()};
  w.appendChild(mk('الصوت',aud));
  const inv=document.createElement('button');inv.className='toggle'+(S.settings.invert?' on':'');inv.textContent=S.settings.invert?'معكوس ↕':'عادي ↕';
  inv.onclick=()=>{S.settings.invert=!S.settings.invert;inv.className='toggle'+(S.settings.invert?' on':'');inv.textContent=S.settings.invert?'معكوس ↕':'عادي ↕';scheduleSave()};
  w.appendChild(mk('عكس محور النظر',inv));
  const saveB=this.btn('💾 حفظ الآن','',( )=>{saveNow();UI.toast('تم الحفظ ✓','gold')});
  const tutB=this.btn('🔁 إعادة الدرس التعليمي','alt',()=>{S.tut=0;tutAcc=0;Player.lookDist=0;this.close();scheduleSave()});
  const resetB=this.btn('🗑 مسح الحفظ والبدء من جديد','alt',()=>{if(confirm('سيتم مسح كل تقدمك نهائيًا. هل أنت متأكد؟')){SaveSys.del('save');location.reload()}});
  const about=document.createElement('div');about.style.cssText='font-size:11px;color:var(--dim);text-align:center;margin-top:14px';
  about.innerHTML='HAYSTACK v0.1.0 — المرحلة الأولى ⛏<br>من البحث باليدين… إلى إمبراطورية القش.';
  const col=document.createElement('div');col.style.cssText='display:flex;flex-direction:column;gap:8px;margin-top:10px';
  col.append(saveB,tutB,resetB);w.append(col,about);return w}};
$('sheet-close').onclick=()=>Modals.close();$('backdrop').onclick=()=>Modals.close();

/* ================= game loop ================= */
let last=performance.now(),fpsAcc=0,fpsN=0,fpsT=0;
const FWD=new THREE.Vector3(),RIGHT=new THREE.Vector3(),MOVE=new THREE.Vector3(),TMP=new THREE.Vector3();
function update(dt){
 let mx=Input.joy.x,my=Input.joy.y;
 if(Input.keys.KeyW)my+=1;if(Input.keys.KeyS)my-=1;if(Input.keys.KeyA)mx-=1;if(Input.keys.KeyD)mx+=1;
 const k=Math.hypot(mx,my);if(k>1){mx/=k;my/=k}
 const moving=k>.08;
 const sprint=(Input.sprint||Input.keys.ShiftLeft)&&moving&&!Player.crouch&&Player.stamina>1;
 let spd=Player.crouch?1.7:(sprint?6.6:3.4);
 FWD.set(-Math.sin(Player.yaw),0,-Math.cos(Player.yaw));
 RIGHT.set(Math.cos(Player.yaw),0,-Math.sin(Player.yaw));
 MOVE.set(0,0,0).addScaledVector(FWD,my).addScaledVector(RIGHT,mx);
 if(MOVE.lengthSq()>0)MOVE.normalize();
 Player.pos.addScaledVector(MOVE,spd*dt);

 if(sprint)Player.stamina=Math.max(0,Player.stamina-16*dt);
 else Player.stamina=Math.min(100,Player.stamina+(moving?9:14)*dt);
 UI.stamina();

 Player.vy-=22*dt;let ny=Player.pos.y+Player.vy*dt;
 if(ny<=0){if(!Player.grounded&&Player.vy<-5){Particles.burst(new THREE.Vector3(Player.pos.x,0,Player.pos.z),6,0x9b8a6a,1.4,1)}
  Player.pos.y=0;Player.vy=0;Player.grounded=true}else{Player.pos.y=ny;Player.grounded=false}

 for(const c of Colliders){const dx=Player.pos.x-c.x,dz=Player.pos.z-c.z;const d=Math.hypot(dx,dz),min=c.r+.42;
  if(d<min&&d>.0001){const push=(min-d)/d;Player.pos.x+=dx*push;Player.pos.z+=dz*push}}
 Player.pos.x=clamp(Player.pos.x,-33,33);Player.pos.z=clamp(Player.pos.z,-28,28);
 Player.moveDist+=spd*dt*(moving?1:0);

 const spdNow=moving?spd:0;
 if(Player.grounded&&moving){Player.bobT+=dt*spdNow*1.7;Player.stepT-=dt*spdNow;
  if(Player.stepT<=0){Player.stepT=2.1;AudioSys.step(sprint)}}

 Player.pitchKick=lerp(Player.pitchKick,0,Math.min(1,dt*8));
 Player.shakeAmp=Math.max(0,Player.shakeAmp-dt*.5);
 const shx=(Math.random()-.5)*Player.shakeAmp,shy=(Math.random()-.5)*Player.shakeAmp;
 const bobY=Player.grounded&&moving?Math.abs(Math.sin(Player.bobT))*.05:0;
 camera.position.set(Player.pos.x+shx,Player.eye()+Player.pos.y+bobY+shy,Player.pos.z);
 camera.rotation.set(Player.pitch+Player.pitchKick,Player.yaw,0);

 const tfov=sprint?S.settings.fov+8:(Player.crouch?S.settings.fov-4:S.settings.fov);
 camera.fov=lerp(camera.fov,tfov,Math.min(1,dt*5));camera.updateProjectionMatrix();

 actionCd=Math.max(0,actionCd-dt);
 if(Input.actionHeld&&actionCd<=0&&!UI.modalOpen)doInteract();

 updateHover(dt);
 Hands.update(dt,moving?spd/3.4:0);
 Pickups.update(dt,new THREE.Vector3(Player.pos.x,Player.pos.y+.8,Player.pos.z));
 Particles.update(dt);Floaters.update(dt);
 for(const z of ZONES)if(z.beam)z.beam.rotation.y+=dt*.5;
 for(const c of Clouds)c.position.x+=dt*.6;
 tutUpdate(dt);misBadge();

 fpsN++;fpsT+=dt;if(fpsT>=1){$('fps-tag').textContent=Math.round(fpsN/fpsT)+' FPS';fpsN=0;fpsT=0}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt);renderer.render(scene,camera)}

/* ================= boot ================= */
const TIPS=['الإبر الذهبية أثمن مما تظن…','المغناطيس يضاعف فرص العثور على المعادن','بِع القش بانتظام لتوسيع حقيبتك','الأدوات الأفضل = سعة أكبر لكل ضربة','الإبرة العتيقة أسطورة… أم حقيقة؟'];
async function boot(){
 drawLogo();$('load-tip').textContent=TIPS[0];
 await SaveSys.init();$('load-fill').style.width='25%';
 const raw=await SaveSys.get('save');
 S=Object.assign(freshState(),raw||{});
 S.settings=Object.assign(freshState().settings,raw?.settings||{});
 S.stats=Object.assign(freshState().stats,raw?.stats||{});
 if(raw){const f=freshState();S.inv=Object.assign({},raw.inv||{});S.tools=Object.assign({hands:{lvl:0}},raw.tools||{});
  S.missions=raw.missions||{};S.piles=raw.piles||{};if(!TOOLS[S.equipped])S.equipped='hands'}
 AudioSys.on=S.settings.audio;
 $('load-fill').style.width='40\%';$('load-tip').textContent='بناء المزرعة…';
 makeTextures();initThree();scene.add(camera);
 const q=QUALITY[S.settings.quality];renderer.setPixelRatio(Math.min(devicePixelRatio,q.dpr));
 buildWorld();
 for(const c of[...Colliders])c.hayCol=false;
 Hay.build(q.pieces);
 for(const p of Hay.piles){const cc={x:p.def.x,z:p.def.z,r:p.def.R*.55,hayCol:true};
  if(!Colliders.some(c=>c.hayCol&&c.x===cc.x&&c.z===cc.z))Colliders.push(cc)}
 Particles.init();Floaters.init();initReticle();Hands.build();
 initInput();UI.hud();UI.stamina();
 Player.fov=S.settings.fov;camera.fov=S.settings.fov;
 $('load-fill').style.width='80\%';$('load-tip').textContent='تشغيل الأنظمة…';
 setInterval(()=>saveNow(),20000);
 setInterval(misBadge,1500);
 if(raw&&Date.now()-S.ts<1000*60*60*24*30)UI.toast('مرحبًا بعودتك! تم تحميل حفظك ✓','gold');
 else UI.toast('ابحث عن الإبرة في كومة القش! 🪡','gold');
 $('load-fill').style.width='100%';
 setTimeout(()=>{$('loading').style.transition='opacity .5s';$('loading').style.opacity=0;
  setTimeout(()=>$('loading').remove(),520)},350);
 requestAnimationFrame(loop);
 console.log('%cHAYSTACK v0.1.0 — Stage 1 ready ⛏','color:#ffb52e;font-weight:bold;font-size:14px');
}
$('btn-punch').addEventListener('pointerdown',e=>{e.preventDefault();Player.pitch=0;AudioSys.ensure()});
boot().catch(e=>{console.error(e);$('load-tip').textContent='خطأ في التحميل: '+e.message;$('load-tip').style.color='#ff6b6b'});
</script>
